name: v30.1.5 exact-artifact publication recovery

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Exact one-time publication recovery authorization
        required: true
        type: string
      configuration_receipt:
        description: Base64 developer-signed immutable-release configuration receipt
        required: true
        type: string
      configuration_signature:
        description: Base64 SSH signature of the configuration receipt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v30.1.5-exact-artifact-publication-recovery
  cancel-in-progress: false

jobs:
  publish:
    name: Publish already-built and attested v30.1.5 artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: production-release
    permissions:
      actions: read
      attestations: read
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: runtime
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 1038d1eed8e699580848dcca79de8f0f60430eb6
      TAG: v30.1.5
      VERSION: 30.1.5
      ASSET_PREFIX: Blackcoin-30.1.5
      SOURCE_DATE_EPOCH: '1789091346'
      SOURCE_RUN_ID: '34564576294'
      UNSIGNED_FINAL_ACK: ${{ vars.UNSIGNED_FINAL_ACK }}
      RECOVERY_ACK: ${{ inputs.acknowledgement }}
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout signed publication controls
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify exact source, control, completed jobs, and artifact inventory
        working-directory: control
        run: |
          set -euo pipefail
          test "$UNSIGNED_FINAL_ACK" = V30.1.5
          python3 ci/release/verify_publication_recovery_state.py state \
            --acknowledgement "$RECOVERY_ACK"

      - name: Verify fresh developer-signed immutable configuration receipt
        working-directory: control
        env:
          RECEIPT_BASE64: ${{ inputs.configuration_receipt }}
          SIGNATURE_BASE64: ${{ inputs.configuration_signature }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          for variable, filename in (("RECEIPT_BASE64", "release-configuration.json"),
                                     ("SIGNATURE_BASE64", "release-configuration.json.sig")):
              value = os.environ[variable]
              if not value or len(value) > 8192:
                  raise SystemExit("invalid receipt input length")
              Path(os.environ["RUNNER_TEMP"], filename).write_bytes(base64.b64decode(value, validate=True))
          PY
          python3 ci/release/verify_publication_recovery_state.py receipt \
            --receipt "$RUNNER_TEMP/release-configuration.json" \
            --signature "$RUNNER_TEMP/release-configuration.json.sig"

      - name: Checkout frozen v30.1.5 runtime source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: runtime
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download only the six pinned existing artifacts
        run: |
          set -euo pipefail
          python3 ../control/ci/release/verify_publication_recovery_assets.py download --output artifacts

      - name: Reconstruct original deterministic release metadata without rebuilding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%ct HEAD)" = "$SOURCE_DATE_EPOCH"
          mkdir dist
          shopt -s nullglob
          primaries=(artifacts/release-"$VERSION"-*-primary-"$SOURCE_SHA")
          test "${#primaries[@]}" -eq 5
          for primary in "${primaries[@]}"; do
            for source in "$primary"/*; do
              destination="dist/$(basename "$source")"
              test -f "$source" && test ! -L "$source" && test ! -e "$destination"
              cp "$source" "$destination"
            done
          done
          cp "artifacts/release-$VERSION-reproducibility-$SOURCE_SHA/$ASSET_PREFIX-REPRODUCIBILITY.txt" dist/
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT.txt
          python3 ci/release/generate_spdx_sbom.py \
            --artifacts dist --depends-packages depends/packages \
            --dependency-manifest ci/release/dependency-security-manifest.json \
            --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output "dist/$ASSET_PREFIX-SBOM.spdx.json"
          python3 ci/release/generate_provenance.py \
            --artifacts dist --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" --version "$VERSION" --tag "$TAG" \
            --workflow-run-id "$SOURCE_RUN_ID" \
            --output "dist/$ASSET_PREFIX-provenance.intoto.json"
          python3 ci/release/generate_unsigned_release_metadata.py \
            --artifacts dist --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --tag "$TAG" --workflow-run-id "$SOURCE_RUN_ID" \
            --acknowledgement "$UNSIGNED_FINAL_ACK" --macos-adhoc-signed \
            --notice "dist/$ASSET_PREFIX-UNSIGNED-PRODUCTION.txt" \
            --manifest "dist/$ASSET_PREFIX-UNSIGNED-PRODUCTION.json"
          (cd dist && find . -maxdepth 1 -type f -printf '%P\n' |
            sort | while IFS= read -r file; do sha256sum "$file"; done > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt dist/
          {
            echo '# Blackcoin-Dev source-signed production release'
            echo
            echo "The exact v$VERSION source commit and annotated tag are SSH-signed by Blackcoin-Dev and verified by GitHub."
            echo 'Windows packages are not Authenticode-signed. macOS applications carry only identity-free ad-hoc launch signatures and are not notarized.'
            echo 'Verify the platform-signing notice, SHA256 checksums, exact signed source commit and tag, SBOM, provenance, and GitHub attestations before installing.'
            echo
            cat "doc/release-notes/release-notes-$VERSION.md"
            echo '## Source commit'
            echo
            echo "\`$SOURCE_SHA\`"
            echo
            echo '## SHA256 checksums'
            echo
            echo '| Archive | Checksum |'
            echo '| --- | --- |'
            while read -r hash file; do
              echo "| $file | $hash |"
            done < dist/SHA256SUMS.txt
          } > RELEASE_NOTES.md

      - name: Verify original attestations bind every reconstructed release file
        run: |
          set -euo pipefail
          common_args=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"
            --signer-digest "$SOURCE_SHA"
            --source-digest "$SOURCE_SHA"
            --source-ref "refs/tags/$TAG"
            --deny-self-hosted-runners
            --format json
          )
          probe="dist/$ASSET_PREFIX-Linux-x86_64.tar.gz"
          gh attestation verify "$probe" "${common_args[@]}" > slsa-verification.json
          gh attestation verify "$probe" "${common_args[@]}" \
            --predicate-type 'https://spdx.dev/Document/v2.3' > spdx-verification.json
          python3 ../control/ci/release/verify_publication_recovery_assets.py verify \
            --dist dist --slsa slsa-verification.json --spdx spdx-verification.json

      - name: Recheck authorization and prepare exact draft
        run: |
          set -euo pipefail
          (cd ../control && python3 ci/release/verify_publication_recovery_state.py state \
            --acknowledgement "$RECOVERY_ACK")
          (cd ../control && python3 ci/release/verify_publication_recovery_state.py receipt \
            --receipt "$RUNNER_TEMP/release-configuration.json" \
            --signature "$RUNNER_TEMP/release-configuration.json.sig")
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --verify-tag --target "$SOURCE_SHA" --title "Blackcoin Core v$VERSION" \
            --notes-file RELEASE_NOTES.md
          verified=false
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > draft-release.json &&
              python3 ../control/ci/release/verify_publication_recovery_assets.py release \
                --dist dist --notes RELEASE_NOTES.md --release draft-release.json --phase draft; then
              verified=true
              break
            fi
            echo "Waiting for draft asset metadata ($attempt/12)"
            sleep 5
          done
          test "$verified" = true

      - name: Publish verified immutable final release and verify uploaded inventory
        run: |
          set -euo pipefail
          (cd ../control && python3 ci/release/verify_publication_recovery_state.py receipt \
            --receipt "$RUNNER_TEMP/release-configuration.json" \
            --signature "$RUNNER_TEMP/release-configuration.json.sig")
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          verified=false
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published-release.json &&
              python3 ../control/ci/release/verify_publication_recovery_assets.py release \
                --dist dist --notes RELEASE_NOTES.md --release published-release.json --phase published; then
              verified=true
              break
            fi
            echo "Waiting for immutable release metadata ($attempt/12)"
            sleep 5
          done
          test "$verified" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = \
            3172dd96f7963491e78e6f60f990ee11c65fa125
          printf 'Published verified immutable final release: https://github.com/%s/releases/tag/%s\n' \
            "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Reverify both existing 20-subject attestations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p attestation-verification
          probe=dist/Blackcoin-30.1.4-Linux-x86_64.tar.gz
          common=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"
            --signer-digest "$PUBLISHED_CONTROL_SHA"
            --source-digest "$PUBLISHED_CONTROL_SHA"
            --source-ref "$PUBLISHED_CONTROL_REF"
            --deny-self-hosted-runners
            --format json
          )
          indexed=false
          for _ in {1..12}; do
            if gh attestation verify "$probe" "${common[@]}" \
                > attestation-verification/slsa.json 2>/dev/null && \
              gh attestation verify "$probe" "${common[@]}" \
                --predicate-type 'https://spdx.dev/Document/v2.3' \
                > attestation-verification/spdx.json 2>/dev/null; then
              indexed=true
              break
            fi
            sleep 5
          done
          test "$indexed" = true

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {}
          for line in Path("dist/SHA256SUMS.txt").read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              expected[name.strip()] = digest
          if len(expected) != 20:
              raise SystemExit("attestation subject inventory must contain 20 assets")
          certificate = {
              "githubWorkflowTrigger": "workflow_dispatch",
              "githubWorkflowSHA": os.environ["PUBLISHED_CONTROL_SHA"],
              "githubWorkflowRef": os.environ["PUBLISHED_CONTROL_REF"],
              "buildSignerDigest": os.environ["PUBLISHED_CONTROL_SHA"],
              "runnerEnvironment": "github-hosted",
              "sourceRepositoryDigest": os.environ["PUBLISHED_CONTROL_SHA"],
              "sourceRepositoryRef": os.environ["PUBLISHED_CONTROL_REF"],
              "sourceRepositoryIdentifier": "1290339568",
              "sourceRepositoryOwnerIdentifier": "298119138",
              "buildConfigDigest": os.environ["PUBLISHED_CONTROL_SHA"],
              "runInvocationURI": (
                  "https://github.com/Blackcoin-Dev/Blackcoin/actions/runs/"
                  f"{os.environ['PUBLISHED_RUN_ID']}/attempts/1"
              ),
          }
          for filename, predicate in (
              ("slsa.json", "https://slsa.dev/provenance/v1"),
              ("spdx.json", "https://spdx.dev/Document/v2.3"),
          ):
              entries = json.loads(Path("attestation-verification", filename).read_text())
              matches = []
              for entry in entries:
                  result = entry["verificationResult"]
                  statement = result["statement"]
                  subjects = {item["name"]: item["digest"]["sha256"] for item in statement["subject"]}
                  cert = result["signature"]["certificate"]
                  if (statement.get("predicateType") == predicate and subjects == expected and
                      all(cert.get(key) == value for key, value in certificate.items())):
                      matches.append(entry)
              if not matches:
                  raise SystemExit(f"{filename} has no exact control-bound 20-subject attestation")
          PY

      - name: Upload through the numeric draft ID and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > draft-before.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("draft-before.json").read_text())
          if release.get("id") != int(os.environ["DRAFT_RELEASE_ID"]):
              raise SystemExit("numeric draft identity differs before upload")
          if release.get("tag_name") != os.environ["SOURCE_TAG"] or release.get("draft") is not True:
              raise SystemExit("numeric release is not the expected draft before upload")
          if hashlib.sha256((release.get("body") or "").encode()).hexdigest() != os.environ["EXPECTED_RELEASE_BODY_SHA256"]:
              raise SystemExit("numeric draft body differs before upload")
          expected = {
              path.name: (path.stat().st_size, f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}")
              for path in Path("dist").iterdir()
              if path.is_file() and not path.is_symlink()
          }
          if len(expected) != 21:
              raise SystemExit("local upload inventory must contain 21 assets")
          assets = release.get("assets", [])
          actual = {asset["name"]: (asset["size"], asset.get("digest")) for asset in assets}
          if len(actual) != len(assets) or not set(actual).issubset(expected):
              raise SystemExit("draft contains duplicate or unexpected assets")
          mismatched = sorted(name for name, value in actual.items() if value != expected[name])
          if mismatched:
              raise SystemExit(f"draft contains byte-mismatched assets: {mismatched}")
          Path("missing-assets.txt").write_text("".join(f"{name}\n" for name in sorted(set(expected) - set(actual))))
          PY

          while IFS= read -r asset; do
            test -n "$asset"
            encoded=$(python3 - "$asset" <<'PY'
          import sys
          import urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
          )
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@dist/$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID/assets?name=$encoded" \
              > uploaded-asset.json
            python3 - "$asset" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          name = sys.argv[1]
          asset = json.loads(Path("uploaded-asset.json").read_text())
          path = Path("dist", name)
          expected = (name, path.stat().st_size)
          actual = (asset.get("name"), asset.get("size"))
          if actual != expected:
              raise SystemExit(f"uploaded asset response differs for {name}: {actual}")
          expected_digest = f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
          if asset.get("digest") not in (None, expected_digest):
              raise SystemExit(f"uploaded asset response digest differs for {name}")
          PY
          done < missing-assets.txt

          verified=false
          for _ in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > draft-complete.json
            if python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("draft-complete.json").read_text())
          if release.get("id") != int(os.environ["DRAFT_RELEASE_ID"]):
              raise SystemExit("completed draft numeric identity differs")
          if release.get("tag_name") != os.environ["SOURCE_TAG"] or release.get("draft") is not True:
              raise SystemExit("completed release is not the expected draft")
          if release.get("name") != "Blackcoin Core v30.1.4" or release.get("prerelease") is not False:
              raise SystemExit("completed draft title or prerelease state differs")
          if release.get("immutable") is not False:
              raise SystemExit("completed draft unexpectedly became immutable")
          author = release.get("author", {})
          if (author.get("id"), author.get("login"), author.get("type")) != (41898282, "github-actions[bot]", "Bot"):
              raise SystemExit("completed draft author differs")
          if hashlib.sha256((release.get("body") or "").encode()).hexdigest() != os.environ["EXPECTED_RELEASE_BODY_SHA256"]:
              raise SystemExit("completed draft body differs")
          expected = {
              path.name: (path.stat().st_size, f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}")
              for path in Path("dist").iterdir()
              if path.is_file() and not path.is_symlink()
          }
          assets = release.get("assets", [])
          actual = {asset["name"]: (asset["size"], asset.get("digest")) for asset in assets}
          if len(actual) != len(assets) or actual != expected:
              raise SystemExit("completed draft asset inventory differs")
          PY
            then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = true

          CURRENT_CONTROL_TAG_OBJECT=$(git -C runtime-source rev-parse "refs/tags/$CONTROL_TAG^{tag}")
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" > source-ref-before-publish.json
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$SOURCE_TAG_OBJECT" > source-tag-before-publish.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CONTROL_TAG" > control-ref-before-publish.json
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$CURRENT_CONTROL_TAG_OBJECT" > control-tag-before-publish.json
          CURRENT_CONTROL_TAG_OBJECT="$CURRENT_CONTROL_TAG_OBJECT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source_ref = json.loads(Path("source-ref-before-publish.json").read_text())
          source_tag = json.loads(Path("source-tag-before-publish.json").read_text())
          control_ref = json.loads(Path("control-ref-before-publish.json").read_text())
          control_tag = json.loads(Path("control-tag-before-publish.json").read_text())
          if source_ref.get("ref") != f"refs/tags/{os.environ['SOURCE_TAG']}":
              raise SystemExit("source tag ref changed before publication")
          if (source_ref.get("object", {}).get("type"), source_ref.get("object", {}).get("sha")) != ("tag", os.environ["SOURCE_TAG_OBJECT"]):
              raise SystemExit("source tag ref object changed before publication")
          if source_tag.get("sha") != os.environ["SOURCE_TAG_OBJECT"]:
              raise SystemExit("source annotated tag object changed before publication")
          if (source_tag.get("object", {}).get("type"), source_tag.get("object", {}).get("sha")) != ("commit", os.environ["SOURCE_SHA"]):
              raise SystemExit("source annotated tag target changed before publication")
          source_verification = source_tag.get("verification", {})
          if source_verification.get("verified") is not True or source_verification.get("reason") != "valid":
              raise SystemExit("source tag signature is not verified before publication")
          expected_control_ref = f"refs/tags/{os.environ['CONTROL_TAG']}"
          control_object = os.environ["CURRENT_CONTROL_TAG_OBJECT"]
          if control_ref.get("ref") != expected_control_ref:
              raise SystemExit("publication control tag ref changed before publication")
          if (control_ref.get("object", {}).get("type"), control_ref.get("object", {}).get("sha")) != ("tag", control_object):
              raise SystemExit("publication control tag ref object changed before publication")
          if control_tag.get("sha") != control_object:
              raise SystemExit("publication control annotated tag changed before publication")
          if (control_tag.get("object", {}).get("type"), control_tag.get("object", {}).get("sha")) != ("commit", os.environ["GITHUB_SHA"]):
              raise SystemExit("publication control tag target changed before publication")
          control_verification = control_tag.get("verification", {})
          if control_verification.get("verified") is not True or control_verification.get("reason") != "valid":
              raise SystemExit("publication control tag signature is not verified before publication")
          PY

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" \
            -F draft=false -f make_latest=true > publish-response.json

          published=false
          for _ in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" > final-release.json
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG" > final-by-tag.json
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
            if python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("final-release.json").read_text())
          by_tag = json.loads(Path("final-by-tag.json").read_text())
          latest = json.loads(Path("latest-release.json").read_text())
          expected_id = int(os.environ["DRAFT_RELEASE_ID"])
          if release.get("id") != expected_id or by_tag.get("id") != expected_id or latest.get("id") != expected_id:
              raise SystemExit("published numeric, tag, or latest identity differs")
          if release.get("tag_name") != os.environ["SOURCE_TAG"]:
              raise SystemExit("published tag differs")
          if release.get("draft") is not False or release.get("prerelease") is not False:
              raise SystemExit("published release state differs")
          if release.get("immutable") is not True:
              raise SystemExit("published release is not immutable")
          if release.get("name") != "Blackcoin Core v30.1.4":
              raise SystemExit("published title differs")
          author = release.get("author", {})
          if (author.get("id"), author.get("login"), author.get("type")) != (41898282, "github-actions[bot]", "Bot"):
              raise SystemExit("published author differs")
          if hashlib.sha256((release.get("body") or "").encode()).hexdigest() != os.environ["EXPECTED_RELEASE_BODY_SHA256"]:
              raise SystemExit("published body differs")
          expected = {
              path.name: (path.stat().st_size, f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}")
              for path in Path("dist").iterdir()
              if path.is_file() and not path.is_symlink()
          }
          assets = release.get("assets", [])
          actual = {asset["name"]: (asset["size"], asset.get("digest")) for asset in assets}
          if len(actual) != len(assets) or actual != expected:
              raise SystemExit("published asset inventory differs")
          print(release["html_url"])
          PY
            then
              published=true
              break
            fi
            sleep 5
          done
          test "$published" = true

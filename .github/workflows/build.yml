          output = Path("release-recovery-evidence/Blackcoin-30.1.4-RELEASE-RECOVERY-EVIDENCE.json")
          output.parent.mkdir(parents=True, exist_ok=False)
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload exact API-bound release recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-recovery-evidence-${{ needs.resolve-target.outputs.target_sha }}-${{ needs.resolve-target.outputs.control_workflow_sha }}
          path: release-recovery-evidence/Blackcoin-30.1.4-RELEASE-RECOVERY-EVIDENCE.json
          if-no-files-found: error
          retention-days: 7

  safety-gate-required:
    name: Require fresh or API-bound exact-SHA safety evidence
    needs:
      - resolve-target
      - safety-gate
      - recovery-safety-gate
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    env:
      RESOLVE_RESULT: ${{ needs.resolve-target.result }}
      RECOVERY: ${{ needs.resolve-target.outputs.recovery }}
      FRESH_GATE_RESULT: ${{ needs.safety-gate.result }}
      RECOVERY_GATE_RESULT: ${{ needs.recovery-safety-gate.result }}
    steps:
      - name: Fail closed unless exactly one required gate passed
        shell: bash
        run: |
          set -euo pipefail
          test "$RESOLVE_RESULT" = success
          if [[ "$RECOVERY" == true ]]; then
            test "$FRESH_GATE_RESULT" = skipped
            test "$RECOVERY_GATE_RESULT" = success
          else
            test "$FRESH_GATE_RESULT" = success
            test "$RECOVERY_GATE_RESULT" = skipped
          fi

  select-targets:
    name: Select build target
    needs:
      - resolve-target
      - safety-gate-required
      - signed-final-preflight
    if: ${{ always() && needs.resolve-target.result == 'success' && needs.safety-gate-required.result == 'success' && (needs.signed-final-preflight.result == 'success' || (needs.resolve-target.outputs.publish != 'true' && needs.signed-final-preflight.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      macos_matrix: ${{ steps.matrix.outputs.macos_matrix }}
      macos_selected: ${{ steps.matrix.outputs.macos_selected }}
      macos_intel_selected: ${{ steps.matrix.outputs.macos_intel_selected }}
      macos_arm_selected: ${{ steps.matrix.outputs.macos_arm_selected }}
      windows_selected: ${{ steps.matrix.outputs.windows_selected }}
    steps:
      - id: matrix
        shell: bash
        env:
          TARGET: ${{ needs.resolve-target.outputs.target }}
          PUBLISH: ${{ needs.resolve-target.outputs.publish }}
        run: |
          set -euo pipefail
          linux_64='{"name":"linux-64-bit","host":"x86_64-pc-linux-gnu","os":"ubuntu-22.04","packages":"python3","dep-opts":"","config-opts":"--enable-sse2 --enable-glibc-back-compat LDFLAGS=-static-libstdc++","goal":"install"}'
          linux_arm_64='{"name":"linux-arm-64-bit","host":"aarch64-linux-gnu","os":"ubuntu-22.04","packages":"g++-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user","dep-opts":"","config-opts":"--enable-glibc-back-compat LDFLAGS=-static-libstdc++","goal":"install"}'
          windows_64='{"name":"windows-64-bit","host":"x86_64-w64-mingw32","os":"ubuntu-22.04","packages":"nsis g++-mingw-w64-x86-64 build-essential libtool autotools-dev automake pkg-config bsdmainutils curl git zip wine64","postinstall":"sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix\nsudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix","dep-opts":"","config-opts":"--enable-sse2 LDFLAGS=-static-libgcc","goal":"deploy install"}'
          macos_64='{"name":"macos-64-bit","host":"x86_64-apple-darwin","os":"ubuntu-22.04","packages":"curl bsdmainutils cmake libz-dev python3-setuptools libtinfo5 xorriso zip","dep-opts":"","config-opts":"--enable-sse2","goal":"deploy","sdk":"12.2-12B45b","sdk-sha256":"df75d30ecafc429e905134333aeae56ac65fac67cb4182622398fd717df77619"}'
          macos_arm_64='{"name":"macos-arm-64-bit","host":"aarch64-apple-darwin","os":"ubuntu-22.04","packages":"curl bsdmainutils cmake libz-dev python3-setuptools libtinfo5 xorriso zip","dep-opts":"","config-opts":"","goal":"deploy","sdk":"12.2-12B45b","sdk-sha256":"df75d30ecafc429e905134333aeae56ac65fac67cb4182622398fd717df77619"}'
          case "$TARGET" in
            all) matrix="[$linux_64,$linux_arm_64,$windows_64,$macos_64,$macos_arm_64]" ;;
            linux-64-bit) matrix="[$linux_64]" ;;
            linux-arm-64-bit) matrix="[$linux_arm_64]" ;;
            windows-64-bit) matrix="[$windows_64]" ;;
            macos-all) matrix="[$macos_64,$macos_arm_64]" ;;
            macos-64-bit) matrix="[$macos_64]" ;;
            macos-arm-64-bit) matrix="[$macos_arm_64]" ;;
            *) echo "Unknown build target: $TARGET" >&2; exit 1 ;;
          esac
          matrix=$(BASE_MATRIX="$matrix" python3 - <<'PY'
          import json
          import os

          # Final artifacts must also come from independently duplicated
          # exact-source builds before publication.
          builders = ("primary", "verifier")
          result = []
          for target in json.loads(os.environ["BASE_MATRIX"]):
              for builder in builders:
                  entry = dict(target)
                  entry["builder"] = builder
                  result.append(entry)
          print(json.dumps(result, separators=(",", ":")))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          macos_matrix=$(BUILD_MATRIX="$matrix" python3 - <<'PY'
          import json
          import os

          metadata = {
              "macos-64-bit": {
                  "target": "macos-64-bit",
                  "label": "Intel-x86_64",
                  "arch": "x86_64",
                  "runner": "macos-15-intel",
              },
              "macos-arm-64-bit": {
                  "target": "macos-arm-64-bit",
                  "label": "Apple-Silicon-ARM64",
                  "arch": "arm64",
                  "runner": "macos-15",
              },
          }
          include = []
          for target in json.loads(os.environ["BUILD_MATRIX"]):
              if target["name"] in metadata:
                  include.append({**metadata[target["name"]], "builder": target["builder"]})
          print(json.dumps({"include": include}, separators=(",", ":")))
          PY
          )
          echo "macos_matrix=$macos_matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == *macos-64-bit* || "$matrix" == *macos-arm-64-bit* ]]; then
            echo "macos_selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_selected=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$matrix" == *macos-64-bit* ]]; then
            echo "macos_intel_selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_intel_selected=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$matrix" == *macos-arm-64-bit* ]]; then
            echo "macos_arm_selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_arm_selected=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$matrix" == *windows-64-bit* ]]; then
            echo "windows_selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_selected=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }} (${{ matrix.builder }})
    needs:
      - resolve-target
      - safety-gate-required
      - select-targets
    if: ${{ always() && needs.resolve-target.result == 'success' && needs.safety-gate-required.result == 'success' && needs.select-targets.result == 'success' }}
    runs-on: ${{ matrix.os }}
    env:
      MAKEJOBS: 4
      SDK_URL: https://bitcoincore.org/depends-sources/sdks
      SOURCE_DATE_EPOCH: ${{ needs.resolve-target.outputs.source_date_epoch }}
      TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
      VERSION: ${{ needs.resolve-target.outputs.version }}
      PACKAGE_LABEL: ${{ needs.resolve-target.outputs.package_label }}
      CONFIGURED_VERSION: ${{ needs.resolve-target.outputs.configured_version }}
      ASSET_PREFIX: ${{ needs.resolve-target.outputs.asset_prefix }}
      PUBLISH: ${{ needs.resolve-target.outputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-targets.outputs.matrix) }}
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make automake cmake curl g++ libtool gperf binutils-gold bsdmainutils pkg-config python3 patch bison lbzip2 xz-utils libxml2-utils gettext xutils-dev
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
          if command -v pkg-config >/dev/null && ! command -v "${{ matrix.host }}-pkg-config" >/dev/null; then
            sudo ln -s "$(command -v pkg-config)" "/usr/local/bin/${{ matrix.host }}-pkg-config"
          fi

      - name: Post install
        if: ${{ matrix.postinstall }}
        run: ${{ matrix.postinstall }}

      - name: Checkout immutable candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: SDK cache
        if: ${{ matrix.sdk }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./depends/sdk-sources
          key: ${{ matrix.name }}-sdk-${{ matrix.sdk-sha256 }}

      - name: Install verified SDK
        if: ${{ matrix.sdk }}
        shell: bash
        run: |
          set -euo pipefail
          archive="Xcode-${{ matrix.sdk }}-extracted-SDK-with-libcxx-headers.tar.gz"
          mkdir -p depends/sdk-sources depends/SDKs
          if [[ ! -f "depends/sdk-sources/$archive" ]]; then
            curl --location --fail "$SDK_URL/$archive" -o "depends/sdk-sources/$archive"
          fi
          echo "${{ matrix.sdk-sha256 }}  depends/sdk-sources/$archive" | sha256sum --check --strict
          tar -C depends/SDKs -xzf "depends/sdk-sources/$archive"

      - name: Dependency cache
        if: ${{ matrix.builder == 'primary' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./depends/built
          key: ${{ matrix.name }}-depends-${{ hashFiles('depends/*.mk', 'depends/packages/*', 'depends/patches/**/*') }}

      - name: Build depends
        run: make -j "$MAKEJOBS" -C depends HOST=${{ matrix.host }} ${{ matrix.dep-opts }}

      - name: Build Blackcoin
        shell: bash
        run: |
          set -euo pipefail
          ./autogen.sh
          ./configure --prefix="$PWD/depends/${{ matrix.host }}" ${{ matrix.config-opts }} --enable-reduce-exports || { cat config.log; exit 1; }
          grep -q "define USE_BDB 1" src/config/bitcoin-config.h || {
            echo "::error::Release build configured without Berkeley DB wallet support"
            exit 1
          }
          grep -q "define USE_SQLITE 1" src/config/bitcoin-config.h || {
            echo "::error::Release build configured without SQLite wallet support"
            exit 1
          }
          source_status=$(git status --porcelain=v1 --untracked-files=all)
          if [[ -n "$source_status" ]]; then
            echo "::error::Release source checkout became dirty before compilation"
            printf '%s\n' "$source_status"
            exit 1
          fi
          case "${{ matrix.name }}" in
            macos-*)
              mkdir -p src/obj
              unset BITCOIN_GENBUILD_FROZEN_SOURCE_COMMIT
              ./share/genbuild.sh "$PWD/src/obj/build.h" "$PWD"
              grep -Fx '#define BUILD_SOURCE_COMMIT "'"$TARGET_SHA"'"' src/obj/build.h
              grep -Fx '#define BUILD_SOURCE_DIRTY 0' src/obj/build.h
              export BITCOIN_GENBUILD_FROZEN_SOURCE_COMMIT="$TARGET_SHA"
              ./share/genbuild.sh "$PWD/src/obj/build.h" "$PWD"
              ;;
          esac
          make_args=()
          if [[ "${{ matrix.name }}" == "windows-64-bit" ]]; then
            make_args+=("BITCOIN_WIN_INSTALLER=$PWD/blackcoin-$CONFIGURED_VERSION-win64-setup.exe")
          fi
          for goal in ${{ matrix.goal }}; do
            if ! make -j "$MAKEJOBS" "${make_args[@]}" "$goal"; then
              make "${make_args[@]}" "$goal" V=1
            fi
          done

      - name: Verify generated source identity and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$TARGET_SHA"
          test -s src/obj/build.h
          case "${{ matrix.name }}" in
            macos-*)
              BITCOIN_GENBUILD_FROZEN_SOURCE_COMMIT="$TARGET_SHA" \
                ./share/genbuild.sh "$PWD/src/obj/build.h" "$PWD"
              ;;
          esac
          grep -Fx '#define BUILD_SOURCE_COMMIT "'"$TARGET_SHA"'"' src/obj/build.h
          grep -Fx '#define BUILD_SOURCE_DIRTY 0' src/obj/build.h
          if grep -q '^#define BUILD_GIT_COMMIT ' src/obj/build.h; then
            grep -Fx '#define BUILD_GIT_COMMIT "'"${TARGET_SHA:0:12}"'"' src/obj/build.h
          else
            grep -Fx '#define BUILD_GIT_TAG "v'"$VERSION"'"' src/obj/build.h
          fi
          git diff --quiet --exit-code --
          git diff --cached --quiet --exit-code --
          source_status=$(git status --porcelain=v1 --untracked-files=all)
          if [[ -n "$source_status" ]]; then
            echo "::error::Release source checkout contains untracked output after compilation"
            printf '%s\n' "$source_status"
            exit 1
          fi

      - name: Build and execute target crypto vectors
        if: ${{ needs.resolve-target.outputs.publish != 'true' && !startsWith(matrix.name, 'macos-') }}
        shell: bash
        run: |
          set -euo pipefail
          test_target=test/test_blackcoin
          test_binary=src/test/test_blackcoin
          if [[ "${{ matrix.name }}" == "windows-64-bit" ]]; then
            test_target+=.exe
            test_binary+=.exe
          fi
          make -C src -j "$MAKEJOBS" "$test_target"
          case "${{ matrix.name }}" in
            linux-64-bit)
              "$test_binary" --run_test=crypto_hardening_tests --log_level=test_suite
              ;;
            linux-arm-64-bit)
              qemu-aarch64 -L /usr/aarch64-linux-gnu \
                "$test_binary" --run_test=crypto_hardening_tests --log_level=test_suite
              ;;
            windows-64-bit)
              wine_runner=$(
                command -v wine64-stable || command -v wine64 ||
                  command -v wine-stable || command -v wine || true
              )
              if [[ -z "$wine_runner" ]]; then
                for candidate in \
                  /opt/wine-stable/bin/wine64 \
                  /usr/lib/wine/wine64 \
                  /usr/lib/x86_64-linux-gnu/wine/wine64; do
                  if [[ -x "$candidate" ]]; then
                    wine_runner="$candidate"
                    break
                  fi
                done
              fi
              test -n "$wine_runner"
              WINEDEBUG=-all "$wine_runner" "$test_binary" \
                --run_test=crypto_hardening_tests --log_level=test_suite
              ;;
          esac

      - name: Verify non-macOS binary identity
        if: ${{ !startsWith(matrix.name, 'macos-') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            expected_line="Blackcoin version v$VERSION"
          else
            expected_line="Blackcoin version v$CONFIGURED_VERSION-${TARGET_SHA:0:12}"
          fi
          binary="depends/${{ matrix.host }}/bin/blackcoind"
          version_home="$RUNNER_TEMP/blackcoin-version-home-${{ matrix.name }}-${{ matrix.builder }}"
          mkdir -p "$version_home"
          case "${{ matrix.name }}" in
            linux-64-bit)
              version_output=$(HOME="$version_home" "$binary" -version 2>&1)
              ;;
            linux-arm-64-bit)
              version_output=$(HOME="$version_home" qemu-aarch64 -L /usr/aarch64-linux-gnu "$binary" -version 2>&1)
              ;;
            windows-64-bit)
              pe_binary="${binary}.exe"
              test -s "$pe_binary" && test ! -L "$pe_binary"
              python3 ci/release/verify_windows_payload.py identity "$pe_binary" \
                --version "$CONFIGURED_VERSION" --source-sha "$TARGET_SHA"
              exit 0
              ;;
          esac
          normalized_output=$(printf '%s\n' "$version_output" | tr -d '\r')
          test "$(printf '%s\n' "$normalized_output" | grep -Fxc "$expected_line")" = 1
          printf '%s\n' "$normalized_output"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ matrix.host }}"
          OUT="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$OUT"
          export LC_ALL=C
          normalize_tree() {
            find "$1" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          }
          deterministic_tar() {
            local root="$1"
            local output="$2"
            shift 2
            tar -C "$root" --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
              --owner=0 --group=0 --numeric-owner --format=posix \
              --pax-option=delete=atime,delete=ctime -cf - "$@" | gzip -n -9 > "$output"
          }
          case "${{ matrix.name }}" in
            linux-64-bit)
              normalize_tree "depends/$HOST/bin"
              mapfile -t files < <(cd "depends/$HOST/bin" && find . -maxdepth 1 -type f -name 'blackcoin*' -printf '%P\n' | sort)
              test "${#files[@]}" -gt 0
              deterministic_tar "depends/$HOST/bin" "$OUT/$ASSET_PREFIX-Linux-x86_64.tar.gz" "${files[@]}"
              ;;
            linux-arm-64-bit)
              normalize_tree "depends/$HOST/bin"
              mapfile -t files < <(cd "depends/$HOST/bin" && find . -maxdepth 1 -type f -name 'blackcoin*' -printf '%P\n' | sort)
              test "${#files[@]}" -gt 0
              deterministic_tar "depends/$HOST/bin" "$OUT/$ASSET_PREFIX-Linux-ARM64.tar.gz" "${files[@]}"
              ;;
            windows-64-bit)
              windows_payload=release
              normalize_tree "$windows_payload"
              python3 ci/release/verify_windows_payload.py directory "$windows_payload"
              python3 ci/release/verify_windows_payload.py identity \
                "$windows_payload/blackcoind.exe" \
                --version "$CONFIGURED_VERSION" --source-sha "$TARGET_SHA"
              mapfile -t files < <(python3 ci/release/verify_windows_payload.py names)
              (cd "$windows_payload" && printf '%s\n' "${files[@]}" | \
                zip -X -9j "$OUT/$ASSET_PREFIX-Windows-x86_64-Portable.zip" -@)
              python3 ci/release/verify_windows_payload.py unsigned-archive \
                "$OUT/$ASSET_PREFIX-Windows-x86_64-Portable.zip"
              mapfile -t installers < <(find . -maxdepth 1 -type f -name "blackcoin-$CONFIGURED_VERSION-win64-setup.exe" -printf '%P\n' | sort)
              test "${#installers[@]}" -eq 1
              cp "${installers[0]}" "$OUT/$ASSET_PREFIX-Windows-x86_64-Installer.exe"
              touch -d "@$SOURCE_DATE_EPOCH" "$OUT/$ASSET_PREFIX-Windows-x86_64-Installer.exe"
              python3 ci/release/verify_windows_payload.py unsigned-file \
                "$OUT/$ASSET_PREFIX-Windows-x86_64-Installer.exe"
              portable_verify_dir="$RUNNER_TEMP/windows-portable-${{ matrix.builder }}"
              installer_verify_dir="$RUNNER_TEMP/windows-installer-${{ matrix.builder }}"
              mkdir "$portable_verify_dir" "$installer_verify_dir"
              unzip -q "$OUT/$ASSET_PREFIX-Windows-x86_64-Portable.zip" \
                -d "$portable_verify_dir"
              7z x -bd -y "-o$installer_verify_dir" \
                "$OUT/$ASSET_PREFIX-Windows-x86_64-Installer.exe" >/dev/null
              python3 ci/release/verify_windows_payload.py installer \
                "$installer_verify_dir" --portable-dir "$portable_verify_dir" >/dev/null
              ;;
            macos-64-bit)
              normalize_tree dist/blackcoin-qt.app
              (cd dist && find blackcoin-qt.app -print | sort | zip -X -9 -y "$OUT/$ASSET_PREFIX-macOS-Intel-x86_64-Qt-app.zip" -@)
              deterministic_tar dist "$OUT/$ASSET_PREFIX-macOS-Intel-x86_64-Qt-app.tar.gz" blackcoin-qt.app
              ;;
            macos-arm-64-bit)
              normalize_tree dist/blackcoin-qt.app
              (cd dist && find blackcoin-qt.app -print | sort | zip -X -9 -y "$OUT/$ASSET_PREFIX-macOS-Apple-Silicon-ARM64-Qt-app.zip" -@)
              deterministic_tar dist "$OUT/$ASSET_PREFIX-macOS-Apple-Silicon-ARM64-Qt-app.tar.gz" blackcoin-qt.app
              ;;
          esac
          printf '%s\n' "$TARGET_SHA" > "$OUT/$ASSET_PREFIX-${{ matrix.name }}-SOURCE_COMMIT.txt"

      - name: Upload non-macOS release assets
        if: ${{ !startsWith(matrix.name, 'macos-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ needs.resolve-target.outputs.package_label }}-${{ matrix.name }}-${{ matrix.builder }}-${{ needs.resolve-target.outputs.target_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload isolated raw macOS cross-build assets
        if: ${{ startsWith(matrix.name, 'macos-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: raw-release-${{ needs.resolve-target.outputs.package_label }}-${{ matrix.name }}-${{ matrix.builder }}-${{ needs.resolve-target.outputs.target_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload configured Windows installer recipe
        if: ${{ matrix.name == 'windows-64-bit' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer-recipe-${{ needs.resolve-target.outputs.package_label }}-${{ matrix.builder }}-${{ needs.resolve-target.outputs.target_sha }}
          path: share/setup.nsi
          if-no-files-found: error
          retention-days: 7

  macos-adhoc:
    name: Ad-hoc sign and validate macOS ${{ matrix.label }} (${{ matrix.builder }})
    needs:
      - resolve-target
      - select-targets
      - build
    if: ${{ always() && needs.resolve-target.result == 'success' && needs.select-targets.result == 'success' && needs.build.result == 'success' && needs.select-targets.outputs.macos_selected == 'true' }}
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.resolve-target.outputs.source_date_epoch }}
      TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
      VERSION: ${{ needs.resolve-target.outputs.version }}
      PACKAGE_LABEL: ${{ needs.resolve-target.outputs.package_label }}
      CONFIGURED_VERSION: ${{ needs.resolve-target.outputs.configured_version }}
      ASSET_PREFIX: ${{ needs.resolve-target.outputs.asset_prefix }}
      PUBLISH: ${{ needs.resolve-target.outputs.publish }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.macos_matrix) }}
    steps:
      - name: Download one exact isolated raw macOS cross-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: raw-release-${{ needs.resolve-target.outputs.package_label }}-${{ matrix.target }}-${{ matrix.builder }}-${{ needs.resolve-target.outputs.target_sha }}
          path: raw-artifact

      - name: Ad-hoc sign, execute, deterministically repack, and reverify
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          PLATFORM_LABEL: ${{ matrix.label }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          set -euo pipefail
          umask 077

          verify_plist_architecture() {
            PLIST_PATH="$1" python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          path = Path(os.environ["PLIST_PATH"])
          with path.open("rb") as source:
              metadata = plistlib.load(source)
          expected_arch = os.environ["EXPECTED_ARCH"]
          if metadata.get("LSArchitecturePriority") != [expected_arch]:
              raise SystemExit(
                  f"LSArchitecturePriority must be exactly [{expected_arch!r}]")
          PY
          }

          raw_tar="raw-artifact/$ASSET_PREFIX-macOS-$PLATFORM_LABEL-Qt-app.tar.gz"
          raw_zip="raw-artifact/$ASSET_PREFIX-macOS-$PLATFORM_LABEL-Qt-app.zip"
          raw_source="raw-artifact/$ASSET_PREFIX-$TARGET_NAME-SOURCE_COMMIT.txt"
          test -s "$raw_tar" && test -f "$raw_tar" && test ! -L "$raw_tar"
          test -s "$raw_zip" && test -f "$raw_zip" && test ! -L "$raw_zip"
          test -s "$raw_source" && test -f "$raw_source" && test ! -L "$raw_source"
          test "$(find raw-artifact -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 3
          test "$(tr -d '\r\n' < "$raw_source")" = "$TARGET_SHA"

          mkdir -p work/tar work/zip work/verify-tar work/verify-zip release-assets
          tar -tzf "$raw_tar" > work/tar-members.txt
          zipinfo -1 "$raw_zip" > work/zip-members.txt
          for members in work/tar-members.txt work/zip-members.txt; do
            test -s "$members"
            awk '
              function unsafe(path, count, part, i) {
                if (substr(path, 1, 1) == "/" || path ~ /\\\\/) return 1
                count = split(path, part, "/")
                for (i = 1; i <= count; ++i) {
                  if (part[i] == "..") return 1
                }
                return 0
              }
              unsafe($0) || $0 !~ /^blackcoin-qt[.]app(\/|$)/ { exit 1 }
            ' "$members"
            test -z "$(sort "$members" | uniq -d)"
          done
          tar -tzvf "$raw_tar" | awk 'substr($1, 1, 1) != "-" && substr($1, 1, 1) != "d" { exit 1 }'
          RAW_ZIP="$raw_zip" python3 - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import PurePosixPath

          seen = set()
          total_size = 0
          with zipfile.ZipFile(os.environ["RAW_ZIP"]) as archive:
              for entry in archive.infolist():
                  path = PurePosixPath(entry.filename)
                  if (entry.filename in seen or path.is_absolute() or ".." in path.parts or
                          "\\" in entry.filename or not path.parts or path.parts[0] != "blackcoin-qt.app"):
                      raise SystemExit(f"unsafe or duplicate ZIP member: {entry.filename}")
                  seen.add(entry.filename)
                  if entry.flag_bits & 0x1:
                      raise SystemExit(f"encrypted ZIP member: {entry.filename}")
                  mode = (entry.external_attr >> 16) & 0xFFFF
                  if mode and not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                      raise SystemExit(f"unsupported ZIP member type: {entry.filename}")
                  total_size += entry.file_size
                  if entry.file_size > 512 * 1024 * 1024 or total_size > 1024 * 1024 * 1024:
                      raise SystemExit("ZIP payload exceeds the fail-closed size limit")
          if not seen:
              raise SystemExit("empty ZIP archive")
          PY

          tar -xzf "$raw_tar" -C work/tar
          ditto -x -k "$raw_zip" work/zip
          test -d work/tar/blackcoin-qt.app
          test -d work/zip/blackcoin-qt.app
          test "$(find work/tar -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 1
          test "$(find work/zip -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 1
          test -z "$(find work/tar work/zip -type l -print -quit)"
          diff -qr work/tar/blackcoin-qt.app work/zip/blackcoin-qt.app

          app=work/tar/blackcoin-qt.app
          binary="$app/Contents/MacOS/blackcoin-qt"
          plist="$app/Contents/Info.plist"
          test -x "$binary" && test -f "$binary" && test ! -L "$binary"
          test -s "$plist" && test -f "$plist" && test ! -L "$plist"
          PLIST_PATH="$plist" python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          path = Path(os.environ["PLIST_PATH"])
          with path.open("rb") as source:
              metadata = plistlib.load(source)
          metadata["LSArchitecturePriority"] = [os.environ["EXPECTED_ARCH"]]
          path.write_bytes(plistlib.dumps(metadata, fmt=plistlib.FMT_XML, sort_keys=False))
          PY
          test "$(lipo -archs "$binary")" = "$EXPECTED_ARCH"
          file "$binary" | grep -F "Mach-O 64-bit executable $EXPECTED_ARCH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = blackcoin-qt
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$VERSION"
          verify_plist_architecture "$plist"

          xattr -cr "$app"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          codesign --verify --strict --verbose=4 "$binary"
          codesign --display --verbose=4 "$app" 2> work/codesign.txt
          grep -Fx 'Signature=adhoc' work/codesign.txt
          grep -Fx 'TeamIdentifier=not set' work/codesign.txt
          grep -E '^Info[.]plist entries=[1-9][0-9]*$' work/codesign.txt
          grep -E '^Sealed Resources version=2 rules=[1-9][0-9]* files=[1-9][0-9]*$' work/codesign.txt
          if grep -q '^Authority=' work/codesign.txt; then
            echo 'Unexpected signing authority in ad-hoc prerelease app' >&2
            exit 1
          fi

          if [[ "$PUBLISH" == true ]]; then
            expected_line="Blackcoin version v$VERSION"
          else
            expected_line="Blackcoin version v$CONFIGURED_VERSION-${TARGET_SHA:0:12}"
          fi
          expected_source_line="Source commit: $TARGET_SHA"
          mkdir -p "$RUNNER_TEMP/blackcoin-version-home"
          version_output=$(HOME="$RUNNER_TEMP/blackcoin-version-home" "$binary" -version 2>&1)
          test "$(printf '%s\n' "$version_output" | sed -n '1p')" = "$expected_line"
          test "$(printf '%s\n' "$version_output" | sed -n '2p')" = "$expected_source_line"
          printf '%s\n' "$version_output"

          signed_tar="release-assets/$ASSET_PREFIX-macOS-$PLATFORM_LABEL-Qt-app.tar.gz"
          signed_zip="release-assets/$ASSET_PREFIX-macOS-$PLATFORM_LABEL-Qt-app.zip"
          APP_ROOT="$app" TAR_OUTPUT="$signed_tar" ZIP_OUTPUT="$signed_zip" python3 - <<'PY'
          import datetime
          import gzip
          import os
          import shutil
          import stat
          import tarfile
          import zipfile
          from pathlib import Path

          app = Path(os.environ["APP_ROOT"])
          tar_output = Path(os.environ["TAR_OUTPUT"])
          zip_output = Path(os.environ["ZIP_OUTPUT"])
          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          if epoch < 315532800:
              raise SystemExit("SOURCE_DATE_EPOCH predates the ZIP format minimum")

          parent = app.parent
          entries = [app, *sorted(app.rglob("*"), key=lambda path: path.relative_to(parent).as_posix())]
          for path in entries:
              mode = path.lstat().st_mode
              if not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                  raise SystemExit(f"unsupported app-bundle entry: {path}")

          with tar_output.open("wb") as raw:
              with gzip.GzipFile(filename="", mode="wb", compresslevel=9, fileobj=raw, mtime=epoch) as compressed:
                  with tarfile.open(fileobj=compressed, mode="w", format=tarfile.PAX_FORMAT) as archive:
                      for path in entries:
                          arcname = path.relative_to(parent).as_posix()
                          info = archive.gettarinfo(str(path), arcname=arcname)
                          info.uid = 0
                          info.gid = 0
                          info.uname = ""
                          info.gname = ""
                          info.mtime = epoch
                          info.pax_headers = {}
                          if info.isfile():
                              with path.open("rb") as source:
                                  archive.addfile(info, source)
                          else:
                              archive.addfile(info)

          timestamp = datetime.datetime.fromtimestamp(epoch, datetime.timezone.utc)
          zip_timestamp = (timestamp.year, timestamp.month, timestamp.day,
                           timestamp.hour, timestamp.minute, timestamp.second)
          with zipfile.ZipFile(zip_output, "w", compression=zipfile.ZIP_DEFLATED,
                               compresslevel=9, strict_timestamps=True) as archive:
              for path in entries:
                  mode = path.lstat().st_mode
                  arcname = path.relative_to(parent).as_posix()
                  is_directory = stat.S_ISDIR(mode)
                  if is_directory:
                      arcname += "/"
                  info = zipfile.ZipInfo(arcname, zip_timestamp)
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_STORED if is_directory else zipfile.ZIP_DEFLATED
                  info.external_attr = (mode & 0xFFFF) << 16
                  if is_directory:
                      info.external_attr |= 0x10
                      archive.writestr(info, b"")
                  else:
                      with path.open("rb") as source, archive.open(info, "w") as destination:
                          shutil.copyfileobj(source, destination)
          PY

          test -s "$signed_tar" && test ! -L "$signed_tar"
          test -s "$signed_zip" && test ! -L "$signed_zip"
          tar -xzf "$signed_tar" -C work/verify-tar
          ditto -x -k "$signed_zip" work/verify-zip
          diff -qr "$app" work/verify-tar/blackcoin-qt.app
          diff -qr "$app" work/verify-zip/blackcoin-qt.app
          for verified_app in work/verify-tar/blackcoin-qt.app work/verify-zip/blackcoin-qt.app; do
            verified_binary="$verified_app/Contents/MacOS/blackcoin-qt"
            verified_plist="$verified_app/Contents/Info.plist"
            test "$(lipo -archs "$verified_binary")" = "$EXPECTED_ARCH"
            verify_plist_architecture "$verified_plist"
            codesign --verify --deep --strict --verbose=4 "$verified_app"
            codesign --verify --strict --verbose=4 "$verified_binary"
            verified_output=$(HOME="$RUNNER_TEMP/blackcoin-version-home" "$verified_binary" -version 2>&1)
            test "$(printf '%s\n' "$verified_output" | sed -n '1p')" = "$expected_line"
            test "$(printf '%s\n' "$verified_output" | sed -n '2p')" = "$expected_source_line"
          done
          printf '%s\n' "$TARGET_SHA" > "release-assets/$ASSET_PREFIX-$TARGET_NAME-SOURCE_COMMIT.txt"

      - name: Upload only native-validated macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ needs.resolve-target.outputs.package_label }}-${{ matrix.target }}-${{ matrix.builder }}-${{ needs.resolve-target.outputs.target_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  macos-adhoc-gate:
    name: Require native macOS validation when selected
    needs:
      - select-targets
      - macos-adhoc
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Fail closed on a skipped or failed required macOS gate
        shell: bash
        env:
          SELECT_TARGETS_RESULT: ${{ needs.select-targets.result }}
          MACOS_SELECTED: ${{ needs.select-targets.outputs.macos_selected }}
          MACOS_ADHOC_RESULT: ${{ needs.macos-adhoc.result }}
        run: |
          set -euo pipefail
          test "$SELECT_TARGETS_RESULT" = success
          if [[ "$MACOS_SELECTED" == true ]]; then
            test "$MACOS_ADHOC_RESULT" = success
          else
            test "$MACOS_ADHOC_RESULT" = skipped
          fi

  reproducibility:
    name: Verify independent byte-for-byte rebuilds
    needs:
      - resolve-target
      - select-targets
      - build
      - macos-adhoc-gate
    if: ${{ always() && needs.resolve-target.result == 'success' && needs.select-targets.result == 'success' && needs.build.result == 'success' && needs.macos-adhoc-gate.result == 'success' }}
    runs-on: ubuntu-22.04
    env:
      TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
      VERSION: ${{ needs.resolve-target.outputs.version }}
      PACKAGE_LABEL: ${{ needs.resolve-target.outputs.package_label }}
      CONFIGURED_VERSION: ${{ needs.resolve-target.outputs.configured_version }}
      RELEASE_CANDIDATE: ${{ needs.resolve-target.outputs.release_candidate }}
      PRERELEASE_CHANNEL: ${{ needs.resolve-target.outputs.prerelease_channel }}
      ASSET_PREFIX: ${{ needs.resolve-target.outputs.asset_prefix }}
      MACOS_SELECTED: ${{ needs.select-targets.outputs.macos_selected }}
    steps:
      - name: Checkout immutable verification code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          fetch-depth: 0

      - name: Download both isolated build sets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: release-${{ needs.resolve-target.outputs.package_label }}-*-${{ needs.resolve-target.outputs.target_sha }}

      - name: Compare every target byte for byte
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          primaries=(artifacts/release-"$PACKAGE_LABEL"-*-primary-"$TARGET_SHA")
          verifiers=(artifacts/release-"$PACKAGE_LABEL"-*-verifier-"$TARGET_SHA")
          test "${#primaries[@]}" -gt 0
          test "${#primaries[@]}" -eq "${#verifiers[@]}"
          mkdir -p release-assets
          report="release-assets/$ASSET_PREFIX-REPRODUCIBILITY.txt"
          {
            printf 'package_label=%s\n' "$PACKAGE_LABEL"
            printf 'prerelease_channel=%s\n' "$PRERELEASE_CHANNEL"
            printf 'configured_version=%s\n' "$CONFIGURED_VERSION"
          } > "$report"
          for primary in "${primaries[@]}"; do
            artifact_name=$(basename "$primary")
            artifact_prefix="release-$PACKAGE_LABEL-"
            target="${artifact_name#"$artifact_prefix"}"
            suffix="-primary-$TARGET_SHA"
            target="${target%"$suffix"}"
            verifier="artifacts/release-$PACKAGE_LABEL-$target-verifier-$TARGET_SHA"
            test -d "$verifier"
            python3 ci/release/verify_reproducible.py \
              --primary "$primary" --verifier "$verifier"
            printf 'target=%s\n' "$target" >> "$report"
            while IFS= read -r file; do
              printf '%s  %s/%s\n' \
                "$(sha256sum "$primary/$file" | awk '{print $1}')" "$target" "$file"
            done < <(cd "$primary" && find . -type f -printf '%P\n' | sort)
          done
          printf 'source_commit=%s\n' "$TARGET_SHA" >> "$report"

      - name: Download both isolated Windows installer recipes
        if: ${{ needs.select-targets.outputs.windows_selected == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: installer-recipes
          pattern: windows-installer-recipe-${{ needs.resolve-target.outputs.package_label }}-*-${{ needs.resolve-target.outputs.target_sha }}

      - name: Verify the Windows installer recipe is reproducible
        if: ${{ needs.select-targets.outputs.windows_selected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/release/verify_reproducible.py \
            --primary "installer-recipes/windows-installer-recipe-$PACKAGE_LABEL-primary-$TARGET_SHA" \
            --verifier "installer-recipes/windows-installer-recipe-$PACKAGE_LABEL-verifier-$TARGET_SHA"

      - name: Assemble conspicuously unsigned exact-SHA canary bundle
        if: ${{ needs.resolve-target.outputs.publish != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p canary-assets
          test -z "$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'raw-release-*' -print -quit)"
          primaries=(artifacts/release-"$PACKAGE_LABEL"-*-primary-"$TARGET_SHA")
          test "${#primaries[@]}" -gt 0
          for primary in "${primaries[@]}"; do
            while IFS= read -r -d '' source; do
              test -f "$source" && test ! -L "$source"
              destination="canary-assets/$(basename "$source")"
              test ! -e "$destination"
              cp "$source" "$destination"
            done < <(find "$primary" -mindepth 1 -maxdepth 1 -print0)
          done
          cp "release-assets/$ASSET_PREFIX-REPRODUCIBILITY.txt" canary-assets/

          marker="canary-assets/$ASSET_PREFIX-UNSIGNED-CANARY.txt"
          {
            echo 'UNSIGNED CANARY ARTIFACTS - NOT A PRODUCTION RELEASE'
            echo
            echo "package_label=$PACKAGE_LABEL"
            echo "prerelease_channel=$PRERELEASE_CHANNEL"
            echo "source_version=$VERSION"
            echo "configured_version=$CONFIGURED_VERSION"
            echo "source_commit=$TARGET_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo 'signed=false'
            echo 'developer_id_signed=false'
            echo "macos_adhoc_signed=$MACOS_SELECTED"
            echo 'notarized=false'
            echo 'published=false'
            echo
            echo "These exact-SHA $PRERELEASE_CHANNEL artifacts are for controlled canary testing only."
            echo 'They are not release-signed, Developer-ID signed, notarized, tagged, or published as a production release.'
            if [[ "$MACOS_SELECTED" == true ]]; then
              echo 'The macOS app bundles have deterministic ad-hoc launch signatures only; they carry no developer identity and are not notarized.'
            fi
            echo 'Verify the unsigned SHA256 manifest before testing.'
          } > "$marker"

          manifest="canary-assets/$ASSET_PREFIX-MANIFEST-UNSIGNED.json"
          manifest_args=(
            --artifacts canary-assets
            --package-label "$PACKAGE_LABEL"
            --source-version "$VERSION"
            --configured-version "$CONFIGURED_VERSION"
            --source-sha "$TARGET_SHA"
            --release-candidate "$RELEASE_CANDIDATE"
            --workflow-run-id "$GITHUB_RUN_ID"
            --output "$manifest"
          )
          if [[ "$MACOS_SELECTED" == true ]]; then
            manifest_args+=(--macos-adhoc-signed)
          fi
          python3 ci/release/generate_canary_manifest.py "${manifest_args[@]}"

          sums="canary-assets/$ASSET_PREFIX-SHA256SUMS-UNSIGNED.txt"
          sums_name=$(basename "$sums")
          mapfile -t checksum_files < <(
            cd canary-assets
            find . -maxdepth 1 -type f ! -name "$sums_name" -printf '%P\n' | sort
          )
          test "${#checksum_files[@]}" -gt 0
          : > "$sums"
          for file in "${checksum_files[@]}"; do
            (cd canary-assets && sha256sum "$file") >> "$sums"
          done
          (cd canary-assets && sha256sum --check --strict "$sums_name")

      - name: Upload unsigned exact-SHA canary bundle
        if: ${{ needs.resolve-target.outputs.publish != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-canary-${{ needs.resolve-target.outputs.package_label }}-${{ needs.resolve-target.outputs.target_sha }}
          path: canary-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ needs.resolve-target.outputs.package_label }}-reproducibility-${{ needs.resolve-target.outputs.target_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  signed-final-preflight:
    name: Require explicit v30.1.4 signed-source publication acknowledgement
    needs:
      - resolve-target
      - safety-gate-required
    if: ${{ always() && needs.resolve-target.result == 'success' && needs.safety-gate-required.result == 'success' && needs.resolve-target.outputs.publish == 'true' }}
    runs-on: ubuntu-22.04
    environment: production-release
    env:
      UNSIGNED_FINAL_ACK: ${{ vars.UNSIGNED_FINAL_ACK }}
    steps:
      - name: Fail closed without the exact publication acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          expected='V30.1.4'
          test "$UNSIGNED_FINAL_ACK" = "$expected" || {
            echo '::error::Protected UNSIGNED_FINAL_ACK does not authorize this v30.1.4 release'
            exit 1
          }

  release:
    name: Publish authorized GitHub release
    needs:
      - resolve-target
      - select-targets
      - build
      - macos-adhoc-gate
      - reproducibility
      - signed-final-preflight
    if: ${{ always() && needs.resolve-target.result == 'success' && needs.select-targets.result == 'success' && needs.build.result == 'success' && needs.macos-adhoc-gate.result == 'success' && needs.reproducibility.result == 'success' && needs.signed-final-preflight.result == 'success' && needs.resolve-target.outputs.publish == 'true' && needs.resolve-target.outputs.target == 'all' && needs.select-targets.outputs.macos_selected == 'true' && needs.select-targets.outputs.windows_selected == 'true' }}
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      TARGET_SHA: ${{ needs.resolve-target.outputs.target_sha }}
      VERSION: ${{ needs.resolve-target.outputs.version }}
      PACKAGE_LABEL: ${{ needs.resolve-target.outputs.package_label }}
      ASSET_PREFIX: ${{ needs.resolve-target.outputs.asset_prefix }}
      TAG: ${{ needs.resolve-target.outputs.tag }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve-target.outputs.source_date_epoch }}
      RECOVERY: ${{ needs.resolve-target.outputs.recovery }}
      CONTROL_WORKFLOW_SHA: ${{ needs.resolve-target.outputs.control_workflow_sha }}
      CONTROL_WORKFLOW_REF: ${{ needs.resolve-target.outputs.control_workflow_ref }}
      CONTROL_WORKFLOW_EVENT: ${{ needs.resolve-target.outputs.control_workflow_event }}
      CONTROL_TAG_OBJECT_SHA: ${{ needs.resolve-target.outputs.control_tag_object_sha }}
      UNSIGNED_FINAL_ACK: ${{ vars.UNSIGNED_FINAL_ACK }}
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.resolve-target.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download only exact-SHA release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: release-${{ needs.resolve-target.outputs.package_label }}-*-primary-${{ needs.resolve-target.outputs.target_sha }}

      - name: Download exact-SHA reproducibility evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: gate-evidence/reproducibility
          name: release-${{ needs.resolve-target.outputs.package_label }}-reproducibility-${{ needs.resolve-target.outputs.target_sha }}

      - name: Download exact API-bound release recovery evidence
        if: ${{ needs.resolve-target.outputs.recovery == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: gate-evidence/recovery
          name: release-recovery-evidence-${{ needs.resolve-target.outputs.target_sha }}-${{ needs.resolve-target.outputs.control_workflow_sha }}

      - name: Install final release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full unzip

      - name: Assemble exact-SHA signed-source release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          expected_ack='V30.1.4'
          test "$UNSIGNED_FINAL_ACK" = "$expected_ack"
          mkdir -p dist
          shopt -s nullglob
          primaries=(artifacts/release-"$PACKAGE_LABEL"-*-primary-"$TARGET_SHA")
          test "${#primaries[@]}" -eq 5
          for primary in "${primaries[@]}"; do
            while IFS= read -r -d '' source; do
              destination="dist/$(basename "$source")"
              test ! -e "$destination"
              cp "$source" "$destination"
            done < <(find "$primary" -mindepth 1 -maxdepth 1 -type f -print0)
          done
          test -s "dist/$ASSET_PREFIX-Linux-x86_64.tar.gz"
          test -s "dist/$ASSET_PREFIX-Linux-ARM64.tar.gz"
          test -s "dist/$ASSET_PREFIX-Windows-x86_64-Portable.zip"
          test -s "dist/$ASSET_PREFIX-Windows-x86_64-Installer.exe"
          test -s "dist/$ASSET_PREFIX-macOS-Intel-x86_64-Qt-app.zip"
          test -s "dist/$ASSET_PREFIX-macOS-Intel-x86_64-Qt-app.tar.gz"
          test -s "dist/$ASSET_PREFIX-macOS-Apple-Silicon-ARM64-Qt-app.zip"
          test -s "dist/$ASSET_PREFIX-macOS-Apple-Silicon-ARM64-Qt-app.tar.gz"
          python3 ci/release/verify_windows_payload.py unsigned-archive \
            "dist/$ASSET_PREFIX-Windows-x86_64-Portable.zip"
          python3 ci/release/verify_windows_payload.py unsigned-file \
            "dist/$ASSET_PREFIX-Windows-x86_64-Installer.exe"
          mkdir -p work/windows-portable work/windows-installer
          unzip -q "dist/$ASSET_PREFIX-Windows-x86_64-Portable.zip" \
            -d work/windows-portable
          7z x -bd -y "-owork/windows-installer" \
            "dist/$ASSET_PREFIX-Windows-x86_64-Installer.exe" >/dev/null
          python3 ci/release/verify_windows_payload.py installer \
            work/windows-installer --portable-dir work/windows-portable >/dev/null
          test -s "gate-evidence/reproducibility/$ASSET_PREFIX-REPRODUCIBILITY.txt"
          cp "gate-evidence/reproducibility/$ASSET_PREFIX-REPRODUCIBILITY.txt" \
            "dist/$ASSET_PREFIX-REPRODUCIBILITY.txt"
          printf '%s\n' "$TARGET_SHA" > dist/SOURCE_COMMIT.txt
          recovery_evidence="dist/$ASSET_PREFIX-RELEASE-RECOVERY-EVIDENCE.json"
          if [[ "$RECOVERY" == true ]]; then
            source_evidence="gate-evidence/recovery/$ASSET_PREFIX-RELEASE-RECOVERY-EVIDENCE.json"
            test -s "$source_evidence" && test ! -L "$source_evidence"
            test "$(find gate-evidence/recovery -mindepth 1 -maxdepth 1 -type f | wc -l)" = 1
            cp "$source_evidence" "$recovery_evidence"
            TARGET_SHA="$TARGET_SHA" CONTROL_WORKFLOW_SHA="$CONTROL_WORKFLOW_SHA" \
              CONTROL_WORKFLOW_REF="$CONTROL_WORKFLOW_REF" \
              CONTROL_TAG_OBJECT_SHA="$CONTROL_TAG_OBJECT_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              Path("dist/Blackcoin-30.1.4-RELEASE-RECOVERY-EVIDENCE.json").read_text(encoding="utf-8")
          )
          if evidence.get("schema") != 1 or evidence.get("release") != "v30.1.4":
              raise SystemExit("release recovery evidence schema or release differs")
          if evidence.get("runtime_source") != {
              "commit": os.environ["TARGET_SHA"],
              "tag": "v30.1.4",
          }:
              raise SystemExit("release recovery evidence runtime source differs")
          control = evidence.get("publication_control", {})
          expected_control = {
              "event": "workflow_dispatch",
              "ref": os.environ["CONTROL_WORKFLOW_REF"],
              "commit": os.environ["CONTROL_WORKFLOW_SHA"],
              "tag_object": os.environ["CONTROL_TAG_OBJECT_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
          }
          if control != expected_control:
              raise SystemExit("release recovery evidence publication control differs")
          reused = evidence.get("reused_safety_run", {})
          if reused.get("id") != 30973290346 or len(reused.get("jobs", [])) != 16:
              raise SystemExit("release recovery safety evidence differs")
          if len(reused.get("artifacts", [])) != 9:
              raise SystemExit("release recovery safety artifact evidence differs")
          failed = evidence.get("failed_tag_publication_run", {})
          if failed.get("id") != 30982555787 or len(failed.get("jobs", [])) != 9:
              raise SystemExit("failed publication evidence differs")
          if failed.get("artifact_total_count") != 0:
              raise SystemExit("failed publication artifact evidence differs")
          failed_recovery = evidence.get("failed_publication_recovery_run", {})
          if failed_recovery.get("id") != 31017178339 or len(failed_recovery.get("jobs", [])) != 11:
              raise SystemExit("failed publication recovery evidence differs")
          if failed_recovery.get("control") != {
              "event": "workflow_dispatch",
              "ref": "refs/tags/v30.1.4-publication-recovery-1",
              "commit": "1e4f5db01b819a192566e6184c700234e46294ce",
              "tag_object": "de3e13a13e98a6179ce0ff0d5fb50eadb0eedc32",
              "github_commit_signature": "valid",
              "github_tag_signature": "valid",
              "local_release_key_fingerprint": "SHA256:jAkpBudDw+ntWHSUx3e1KY+czAFjnlaPxQtRFtptL70",
          }:
              raise SystemExit("failed publication recovery control evidence differs")
          if failed_recovery.get("artifact_total_count") != 1 or len(failed_recovery.get("artifacts", [])) != 1:
              raise SystemExit("failed publication recovery artifact evidence differs")
          if failed_recovery.get("package_artifact_total_count") != 0 or failed_recovery.get("release_or_draft_produced") is not False:
              raise SystemExit("failed publication recovery output evidence differs")
          PY
          else
            test "$RECOVERY" = false
            test ! -e "$recovery_evidence"
            test ! -e gate-evidence/recovery
          fi

          python3 ci/release/verify_dependency_security.py
          python3 ci/release/generate_spdx_sbom.py \
            --artifacts dist --depends-packages depends/packages \
            --dependency-manifest ci/release/dependency-security-manifest.json \
            --version "$VERSION" --source-sha "$TARGET_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output "dist/Blackcoin-$VERSION-SBOM.spdx.json"
          python3 ci/release/generate_provenance.py \
            --artifacts dist --repository "$GITHUB_REPOSITORY" \
            --source-sha "$TARGET_SHA" --version "$VERSION" --tag "$TAG" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output "dist/Blackcoin-$VERSION-provenance.intoto.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          repository = "Blackcoin-Dev/Blackcoin"
          source_sha = os.environ["TARGET_SHA"]
          source_tag = os.environ["TAG"]
          source_ref = f"refs/tags/{source_tag}"
          workflow_sha = os.environ["CONTROL_WORKFLOW_SHA"]
          workflow_ref = os.environ["CONTROL_WORKFLOW_REF"]
          workflow_event = os.environ["CONTROL_WORKFLOW_EVENT"]
          control_tag_object = os.environ["CONTROL_TAG_OBJECT_SHA"]
          recovery = os.environ["RECOVERY"] == "true"
          full_sha = re.compile(r"^[0-9a-f]{40}$")
          if not full_sha.fullmatch(source_sha) or not full_sha.fullmatch(workflow_sha):
              raise SystemExit("source or control workflow SHA is not a full commit identity")
          if workflow_event not in ("push", "workflow_dispatch"):
              raise SystemExit("release workflow event is not an authorized publication event")
          if recovery:
              if workflow_event != "workflow_dispatch":
                  raise SystemExit("publication recovery must record workflow_dispatch")
              if workflow_ref != "refs/tags/v30.1.4-publication-recovery-2":
                  raise SystemExit("publication recovery control ref differs")
              if workflow_sha == source_sha:
                  raise SystemExit("recovery control and runtime source identities must be separate")
              if not full_sha.fullmatch(control_tag_object):
                  raise SystemExit("publication recovery control tag object is missing")
          else:
              if workflow_event != "push" or workflow_ref != source_ref:
                  raise SystemExit("normal publication control identity differs")
              if workflow_sha != source_sha or control_tag_object:
                  raise SystemExit("normal tag publication unexpectedly has a recovery control identity")

          repository_uri = f"git+https://github.com/{repository}.git"
          workflow_uri = f"https://github.com/{repository}/.github/workflows/build.yml"
          provenance_path = Path(f"dist/Blackcoin-{os.environ['VERSION']}-provenance.intoto.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          definition = provenance["predicate"]["buildDefinition"]
          if definition.get("buildType") != f"{workflow_uri}@{source_sha}":
              raise SystemExit("source generator provenance build type differs from its reviewed contract")
          source = definition.get("externalParameters", {}).get("source", {})
          if source != {"uri": repository_uri, "digest": {"gitCommit": source_sha}}:
              raise SystemExit("provenance runtime source identity differs")
          definition["buildType"] = f"{workflow_uri}@{workflow_sha}"
          definition["externalParameters"]["controlWorkflow"] = {
              "uri": workflow_uri,
              "ref": workflow_ref,
              "digest": {"gitCommit": workflow_sha},
              "event": workflow_event,
          }
          definition["externalParameters"]["releaseSourceRef"] = source_ref
          definition["internalParameters"].update({
              "workflowCommit": workflow_sha,
              "workflowEvent": workflow_event,
              "workflowRef": workflow_ref,
              "publicationRecovery": recovery,
          })
          if recovery:
              definition["internalParameters"]["controlTagObject"] = control_tag_object
          definition["resolvedDependencies"] = [
              {"uri": repository_uri, "digest": {"gitCommit": source_sha}},
              {"uri": workflow_uri, "digest": {"gitCommit": workflow_sha}},
          ]
          provenance_path.write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          python3 ci/release/generate_unsigned_release_metadata.py \
            --artifacts dist --version "$VERSION" --source-sha "$TARGET_SHA" \
            --tag "$TAG" --workflow-run-id "$GITHUB_RUN_ID" \
            --acknowledgement "$UNSIGNED_FINAL_ACK" --macos-adhoc-signed \
            --notice "dist/Blackcoin-$VERSION-UNSIGNED-PRODUCTION.txt" \
            --manifest "dist/Blackcoin-$VERSION-UNSIGNED-PRODUCTION.json"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          source_sha = os.environ["TARGET_SHA"]
          source_tag = os.environ["TAG"]
          source_ref = f"refs/tags/{source_tag}"
          workflow_sha = os.environ["CONTROL_WORKFLOW_SHA"]
          workflow_ref = os.environ["CONTROL_WORKFLOW_REF"]
          workflow_event = os.environ["CONTROL_WORKFLOW_EVENT"]
          control_tag_object = os.environ["CONTROL_TAG_OBJECT_SHA"]
          recovery = os.environ["RECOVERY"] == "true"
          full_sha = re.compile(r"^[0-9a-f]{40}$")
          if not full_sha.fullmatch(source_sha) or not full_sha.fullmatch(workflow_sha):
              raise SystemExit("source or control workflow SHA is not a full commit identity")

          manifest_path = Path(f"dist/Blackcoin-{os.environ['VERSION']}-UNSIGNED-PRODUCTION.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_workflow = {
              "event": "push",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "protected_environment": "production-release",
          }
          if manifest.get("workflow") != expected_workflow:
              raise SystemExit("source generator workflow metadata differs from its reviewed contract")
          manifest["workflow"] = {
              "event": workflow_event,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "protected_environment": "production-release",
              "definition": {
                  "path": ".github/workflows/build.yml",
                  "ref": workflow_ref,
                  "commit": workflow_sha,
              },
              "release_source": {
                  "ref": source_ref,
                  "tag": source_tag,
                  "commit": source_sha,
              },
              "publication_recovery": recovery,
          }
          if recovery:
              manifest["workflow"]["definition"]["control_tag_object"] = control_tag_object

          notice_path = Path(f"dist/Blackcoin-{os.environ['VERSION']}-UNSIGNED-PRODUCTION.txt")
          notice = notice_path.read_text(encoding="utf-8")
          marker = f"workflow_run_id={os.environ['GITHUB_RUN_ID']}\n"
          if notice.count(marker) != 1:
              raise SystemExit("unsigned production notice workflow marker differs")
          control_lines = (
              f"workflow_event={workflow_event}\n"
              f"control_workflow_ref={workflow_ref}\n"
              f"control_workflow_commit={workflow_sha}\n"
              f"release_source_ref={source_ref}\n"
              f"publication_recovery={str(recovery).lower()}\n"
          )
          if recovery:
              control_lines += f"control_tag_object={control_tag_object}\n"
          notice_path.write_text(
              notice.replace(marker, marker + control_lines),
              encoding="utf-8",
          )
          subjects = []
          for path in sorted(Path("dist").iterdir()):
              if path == manifest_path:
                  continue
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"release metadata subject is unsafe: {path}")
              subjects.append({
                  "name": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              })
          if not subjects:
              raise SystemExit("release metadata subject inventory is empty")
          version = os.environ["VERSION"]
          expected_subject_names = {
              f"Blackcoin-{version}-Linux-x86_64.tar.gz",
              f"Blackcoin-{version}-Linux-ARM64.tar.gz",
              f"Blackcoin-{version}-Windows-x86_64-Portable.zip",
              f"Blackcoin-{version}-Windows-x86_64-Installer.exe",
              f"Blackcoin-{version}-macOS-Intel-x86_64-Qt-app.zip",
              f"Blackcoin-{version}-macOS-Intel-x86_64-Qt-app.tar.gz",
              f"Blackcoin-{version}-macOS-Apple-Silicon-ARM64-Qt-app.zip",
              f"Blackcoin-{version}-macOS-Apple-Silicon-ARM64-Qt-app.tar.gz",
              f"Blackcoin-{version}-linux-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-linux-arm-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-windows-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-macos-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-macos-arm-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-REPRODUCIBILITY.txt",
              f"Blackcoin-{version}-SBOM.spdx.json",
              f"Blackcoin-{version}-provenance.intoto.json",
              f"Blackcoin-{version}-UNSIGNED-PRODUCTION.txt",
              "SOURCE_COMMIT.txt",
          }
          if recovery:
              expected_subject_names.add(
                  f"Blackcoin-{version}-RELEASE-RECOVERY-EVIDENCE.json"
              )
          actual_subject_names = {subject["name"] for subject in subjects}
          if actual_subject_names != expected_subject_names:
              raise SystemExit(
                  "release metadata subject names differ: "
                  f"missing={sorted(expected_subject_names - actual_subject_names)}, "
                  f"extra={sorted(actual_subject_names - expected_subject_names)}"
              )
          manifest["artifacts_before_manifest_and_checksums"] = subjects
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          verified_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if verified_manifest.get("artifacts_before_manifest_and_checksums") != subjects:
              raise SystemExit("final release manifest subject names, sizes, or SHA256 digests differ")
          PY

          test -z "$(find dist -maxdepth 1 -type f \
            \( -name '*.asc' -o -name '*RELEASE-KEY*' \) -print -quit)"
          (cd dist && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' |
            sort | while IFS= read -r file; do sha256sum "$file"; done > SHA256SUMS.txt)
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)

          python3 - <<'PY'
          import os
          from pathlib import Path

          version = "30.1.4"
          expected = {
              f"Blackcoin-{version}-Linux-x86_64.tar.gz",
              f"Blackcoin-{version}-Linux-ARM64.tar.gz",
              f"Blackcoin-{version}-Windows-x86_64-Portable.zip",
              f"Blackcoin-{version}-Windows-x86_64-Installer.exe",
              f"Blackcoin-{version}-macOS-Intel-x86_64-Qt-app.zip",
              f"Blackcoin-{version}-macOS-Intel-x86_64-Qt-app.tar.gz",
              f"Blackcoin-{version}-macOS-Apple-Silicon-ARM64-Qt-app.zip",
              f"Blackcoin-{version}-macOS-Apple-Silicon-ARM64-Qt-app.tar.gz",
              f"Blackcoin-{version}-linux-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-linux-arm-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-windows-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-macos-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-macos-arm-64-bit-SOURCE_COMMIT.txt",
              f"Blackcoin-{version}-REPRODUCIBILITY.txt",
              f"Blackcoin-{version}-SBOM.spdx.json",
              f"Blackcoin-{version}-provenance.intoto.json",
              f"Blackcoin-{version}-UNSIGNED-PRODUCTION.txt",
              f"Blackcoin-{version}-UNSIGNED-PRODUCTION.json",
              "SOURCE_COMMIT.txt",
              "SHA256SUMS.txt",
          }
          recovery = os.environ["RECOVERY"]
          if recovery == "true":
              expected.add(f"Blackcoin-{version}-RELEASE-RECOVERY-EVIDENCE.json")
          elif recovery != "false":
              raise SystemExit("release recovery mode is not boolean")
          dist = Path("dist")
          entries = list(dist.iterdir())
          actual = {path.name for path in entries}
          if actual != expected:
              raise SystemExit(
                  f"release inventory differs: missing={sorted(expected - actual)}, "
                  f"extra={sorted(actual - expected)}"
              )
          unsafe = sorted(path.name for path in entries if path.is_symlink() or not path.is_file())
          if unsafe:
              raise SystemExit(f"unsafe release entries: {unsafe}")
          empty = sorted(path.name for path in entries if path.stat().st_size == 0)
          if empty:
              raise SystemExit(f"empty release entries: {empty}")
          PY

          {
            echo '# Blackcoin-Dev source-signed production release'
            echo
            echo "The exact v$VERSION source commit and annotated tag are SSH-signed by Blackcoin-Dev and verified by GitHub."
            echo 'Windows packages are not Authenticode-signed. macOS applications carry only identity-free ad-hoc launch signatures and are not notarized.'
            echo 'Verify the platform-signing notice, SHA256 checksums, exact signed source commit and tag, SBOM, provenance, and GitHub attestations before installing.'
            echo
            cat "doc/release-notes/release-notes-$VERSION.md"
            if [[ "$RECOVERY" == true ]]; then
              echo '## Publication recovery'
              echo
              echo "The immutable runtime source remains \`$TARGET_SHA\` at the signed annotated tag \`$TAG\`."
              echo "Publication was recovered with \`workflow_dispatch\` from the separately signed control ref \`$CONTROL_WORKFLOW_REF\` at \`$CONTROL_WORKFLOW_SHA\`."
              echo "Recovery workflow run: \`$GITHUB_RUN_ID\`."
              echo 'The release includes API-bound evidence for successful safety run 30973290346, failed tag-publication run 30982555787, and failed publication-recovery run 31017178339.'
              echo
            fi
            echo "## Source commit"
            echo
            echo "\`$TARGET_SHA\`"
            echo
            echo "## SHA256 checksums"
            echo
            echo '| Archive | Checksum |'
            echo '| --- | --- |'
            while read -r hash file; do
              echo "| $file | $hash |"
            done < dist/SHA256SUMS.txt
          } > RELEASE_NOTES.md

      - name: Publish GitHub build-provenance attestations
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Publish GitHub SBOM attestations
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/Blackcoin-${{ needs.resolve-target.outputs.version }}-SBOM.spdx.json

      - name: Verify every exact release subject has control-bound SLSA and SPDX attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir attestation-verification
          mapfile -t subjects < <(awk '{print $2}' dist/SHA256SUMS.txt)
          expected_count=19
          if [[ "$RECOVERY" == true ]]; then
            expected_count=20
          else
            test "$RECOVERY" = false
          fi
          test "${#subjects[@]}" = "$expected_count"
          for subject in "${subjects[@]}"; do
            test "$subject" = "$(basename "$subject")"
            test -s "dist/$subject" && test ! -L "dist/$subject"
          done
          common_args=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"
            --signer-digest "$CONTROL_WORKFLOW_SHA"
            --source-digest "$CONTROL_WORKFLOW_SHA"
            --source-ref "$CONTROL_WORKFLOW_REF"
            --deny-self-hosted-runners
            --format json
          )

          indexed=false
          probe="dist/${subjects[0]}"
          for _ in {1..12}; do
            if gh attestation verify "$probe" "${common_args[@]}" \
                > attestation-verification/index-slsa.json 2>/dev/null && \
              gh attestation verify "$probe" "${common_args[@]}" \
                --predicate-type 'https://spdx.dev/Document/v2.3' \
                > attestation-verification/index-spdx.json 2>/dev/null; then
              indexed=true
              break
            fi
            sleep 5
          done
          test "$indexed" = true

          EXPECTED_COUNT="$expected_count" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {}
          for line in Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split(maxsplit=1)
              name = name.strip()
              if len(digest) != 64 or any(char not in "0123456789abcdef" for char in digest):
                  raise SystemExit("checksum manifest contains a malformed SHA256 digest")
              if name in expected:
                  raise SystemExit("checksum manifest contains a duplicate subject")
              expected[name] = digest
          expected_count = int(os.environ["EXPECTED_COUNT"])
          if len(expected) != expected_count:
              raise SystemExit("checksum subject count differs")

          recovery = os.environ["RECOVERY"]
          if recovery == "true":
              expected_trigger = "workflow_dispatch"
          elif recovery == "false":
              expected_trigger = "push"
          else:
              raise SystemExit("release recovery mode is not boolean")
          control_sha = os.environ["CONTROL_WORKFLOW_SHA"]
          control_ref = os.environ["CONTROL_WORKFLOW_REF"]
          expected_certificate = {
              "githubWorkflowTrigger": expected_trigger,
              "githubWorkflowSHA": control_sha,
              "githubWorkflowRef": control_ref,
              "buildSignerDigest": control_sha,
              "runnerEnvironment": "github-hosted",
              "sourceRepositoryDigest": control_sha,
              "sourceRepositoryRef": control_ref,
              "sourceRepositoryIdentifier": "1290339568",
              "sourceRepositoryOwnerIdentifier": "298119138",
              "buildConfigDigest": control_sha,
              "runInvocationURI": (
                  "https://github.com/Blackcoin-Dev/Blackcoin/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
              ),
          }

          def subject_map(entry):
              subjects = entry["verificationResult"]["statement"]["subject"]
              return {subject["name"]: subject["digest"]["sha256"] for subject in subjects}

          for predicate, expected_type in (
              ("slsa", "https://slsa.dev/provenance/v1"),
              ("spdx", "https://spdx.dev/Document/v2.3"),
          ):
              path = Path(f"attestation-verification/index-{predicate}.json")
              entries = json.loads(path.read_text(encoding="utf-8"))
              if not entries:
                  raise SystemExit(f"{path.name} has no verified attestations")
              matching = [
                  entry for entry in entries
                  if entry["verificationResult"]["statement"].get("predicateType") == expected_type
                  and subject_map(entry) == expected
                  and all(
                      entry["verificationResult"]["signature"]["certificate"].get(key) == value
                      for key, value in expected_certificate.items()
                  )
              ]
              if not matching:
                  raise SystemExit(
                      f"{path.name} does not bind every exact release subject to the exact publication control"
                  )
          PY

      - name: Create, byte-verify, and publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_SHA" = "$CONTROL_WORKFLOW_SHA"
          test "$GITHUB_SHA" = "$CONTROL_WORKFLOW_SHA"
          test "$GITHUB_REF" = "$CONTROL_WORKFLOW_REF"
          test "$GITHUB_EVENT_NAME" = "$CONTROL_WORKFLOW_EVENT"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$TARGET_SHA"
          if [[ "$RECOVERY" == true ]]; then
            test "$CONTROL_WORKFLOW_REF" = refs/tags/v30.1.4-publication-recovery-2
            test "$(git rev-parse "${CONTROL_WORKFLOW_REF}^{tag}")" = "$CONTROL_TAG_OBJECT_SHA"
            test "$(git rev-parse "${CONTROL_WORKFLOW_REF}^{commit}")" = "$CONTROL_WORKFLOW_SHA"
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${CONTROL_WORKFLOW_REF#refs/tags/}" \
              > final-control-tag-ref.json
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$CONTROL_TAG_OBJECT_SHA" \
              > final-control-tag.json
            CONTROL_WORKFLOW_REF="$CONTROL_WORKFLOW_REF" \
              CONTROL_WORKFLOW_SHA="$CONTROL_WORKFLOW_SHA" \
              CONTROL_TAG_OBJECT_SHA="$CONTROL_TAG_OBJECT_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ref = json.loads(Path("final-control-tag-ref.json").read_text(encoding="utf-8"))
          tag = json.loads(Path("final-control-tag.json").read_text(encoding="utf-8"))
          control_ref = os.environ["CONTROL_WORKFLOW_REF"]
          control_sha = os.environ["CONTROL_WORKFLOW_SHA"]
          tag_object = os.environ["CONTROL_TAG_OBJECT_SHA"]
          if ref.get("ref") != control_ref:
              raise SystemExit("publication-time control tag ref name differs")
          if (ref.get("object", {}).get("type"), ref.get("object", {}).get("sha")) != ("tag", tag_object):
              raise SystemExit("publication-time control tag ref object differs")
          if tag.get("sha") != tag_object:
              raise SystemExit("publication-time control tag object differs")
          if (tag.get("object", {}).get("type"), tag.get("object", {}).get("sha")) != ("commit", control_sha):
              raise SystemExit("publication-time control tag target differs")
          if tag.get("verification", {}).get("verified") is not True:
              raise SystemExit("publication-time control tag is not GitHub-verified")
          if tag.get("verification", {}).get("reason") != "valid":
              raise SystemExit("publication-time control tag signature reason is not valid")
          PY
          else
            test "$RECOVERY" = false
            test -z "$CONTROL_TAG_OBJECT_SHA"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > candidate-draft.json
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --verify-tag --title "Blackcoin Core v$VERSION" --notes-file RELEASE_NOTES.md
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > candidate-draft.json
          fi

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          release = json.loads(Path("candidate-draft.json").read_text(encoding="utf-8"))
          if release.get("draft") is not True:
              raise SystemExit("an existing public release must never be replaced")
          author = release.get("author", {})
          if (author.get("id"), author.get("login"), author.get("type")) != (41898282, "github-actions[bot]", "Bot"):
              raise SystemExit("existing draft author differs from the pinned GitHub Actions bot")
          if release.get("tag_name") != os.environ["TAG"]:
              raise SystemExit("existing draft tag differs")
          if release.get("prerelease") is not False or release.get("name") != f"Blackcoin Core v{os.environ['VERSION']}":
              raise SystemExit("existing draft title or prerelease state differs")
          release_id = release.get("id")
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit("existing draft numeric release identity is invalid")
          body = release.get("body") or ""
          recovery = os.environ["RECOVERY"]
          if recovery == "true":
              required_identity = (
                  os.environ["TARGET_SHA"],
                  os.environ["CONTROL_WORKFLOW_REF"],
                  os.environ["CONTROL_WORKFLOW_SHA"],
              )
              if any(value not in body for value in required_identity):
                  raise SystemExit("existing draft is not bound to the exact source and recovery control")
              run_markers = re.findall(r"Recovery workflow run: `([1-9][0-9]*)`[.]", body)
              if len(run_markers) != 1:
                  raise SystemExit("existing draft does not identify one recovery run")
          elif recovery != "false":
              raise SystemExit("release recovery mode is not boolean")

          expected = {}
          for path in Path("dist").iterdir():
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"unsafe local release asset: {path}")
              expected[path.name] = (
                  path.stat().st_size,
                  f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}",
              )
          release_assets = release.get("assets", [])
          assets = {
              asset["name"]: (asset["size"], asset.get("digest"))
              for asset in release_assets
          }
          exact_current_body = body == Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          exact_current_subset = (
              len(assets) == len(release_assets)
              and set(assets).issubset(expected)
              and all(value == expected[name] for name, value in assets.items())
          )
          if recovery == "false" and not (exact_current_body and exact_current_subset):
              raise SystemExit("normal tag publication cannot replace an existing draft")
          decision = "resume" if exact_current_body and exact_current_subset else "replace"
          Path("draft-decision.txt").write_text(decision + "\n", encoding="utf-8")
          Path("draft-release-id.txt").write_text(str(release_id) + "\n", encoding="utf-8")
          PY

          draft_decision=$(tr -d '\r\n' < draft-decision.txt)
          if [[ "$draft_decision" == replace ]]; then
            draft_release_id=$(tr -d '\r\n' < draft-release-id.txt)
            [[ "$draft_release_id" =~ ^[1-9][0-9]*$ ]]
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$draft_release_id"
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases-after-delete.json
            DRAFT_RELEASE_ID="$draft_release_id" TAG="$TAG" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          releases = json.loads(Path("releases-after-delete.json").read_text(encoding="utf-8"))
          if len(releases) >= 100:
              raise SystemExit("release inventory pagination prevents deletion confirmation")
          release_id = int(os.environ["DRAFT_RELEASE_ID"])
          tag = os.environ["TAG"]
          if any(release.get("id") == release_id or release.get("tag_name") == tag for release in releases):
              raise SystemExit("the exact stale draft still exists after numeric-ID deletion")
          PY
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --verify-tag --title "Blackcoin Core v$VERSION" --notes-file RELEASE_NOTES.md
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > candidate-draft.json
          else
            test "$draft_decision" = resume
          fi

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("candidate-draft.json").read_text(encoding="utf-8"))
          expected_name = f"Blackcoin Core v{os.environ['VERSION']}"
          if release.get("tag_name") != os.environ["TAG"] or release.get("draft") is not True:
              raise SystemExit("an existing release is public or is not the expected draft")
          author = release.get("author", {})
          if (author.get("id"), author.get("login"), author.get("type")) != (41898282, "github-actions[bot]", "Bot"):
              raise SystemExit("the existing draft author differs")
          if release.get("prerelease") is not False or release.get("name") != expected_name:
              raise SystemExit("the existing draft title or prerelease state differs")
          if release.get("body") != Path("RELEASE_NOTES.md").read_text(encoding="utf-8"):
              raise SystemExit("the existing draft release notes differ")
          expected = {}
          for path in Path("dist").iterdir():
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"unsafe local release asset: {path}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              expected[path.name] = (path.stat().st_size, f"sha256:{digest}")
          release_assets = release.get("assets", [])
          assets = {
              asset["name"]: (asset["size"], asset.get("digest"))
              for asset in release_assets
          }
          if len(assets) != len(release_assets):
              raise SystemExit("the existing draft contains duplicate asset names")
          extra = sorted(set(assets) - set(expected))
          if extra:
              raise SystemExit(f"the existing draft contains unexpected assets: {extra}")
          mismatched = sorted(name for name, value in assets.items() if value != expected[name])
          if mismatched:
              raise SystemExit(f"the existing draft contains mismatched assets: {mismatched}")
          missing = sorted(set(expected) - set(assets))
          Path("missing-draft-assets.txt").write_text(
              "".join(f"{name}\n" for name in missing), encoding="utf-8"
          )
          PY

          while IFS= read -r asset; do
            test -n "$asset"
            gh release upload "$TAG" "dist/$asset" --repo "$GITHUB_REPOSITORY"
          done < missing-draft-assets.txt

          draft_verified=false
          for _ in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > draft-release.json
            if python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("draft-release.json").read_text(encoding="utf-8"))
          if release.get("tag_name") != os.environ["TAG"] or release.get("draft") is not True:
              raise SystemExit("the uploaded release is not the expected draft")
          author = release.get("author", {})
          if (author.get("id"), author.get("login"), author.get("type")) != (41898282, "github-actions[bot]", "Bot"):
              raise SystemExit("the uploaded draft author differs")
          if release.get("prerelease") is not False or release.get("name") != f"Blackcoin Core v{os.environ['VERSION']}":
              raise SystemExit("the uploaded draft title or prerelease state differs")
          if release.get("body") != Path("RELEASE_NOTES.md").read_text(encoding="utf-8"):
              raise SystemExit("the uploaded draft release notes differ")
          expected = {
              path.name: (
                  path.stat().st_size,
                  f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}",
              )
              for path in Path("dist").iterdir()
              if path.is_file() and not path.is_symlink()
          }
          if len(expected) != len(list(Path("dist").iterdir())):
              raise SystemExit("local release inventory contains an unsafe entry")
          release_assets = release.get("assets", [])
          assets = {
              asset["name"]: (asset["size"], asset.get("digest"))
              for asset in release_assets
          }
          if len(assets) != len(release_assets) or assets != expected:
              raise SystemExit("uploaded draft asset names, sizes, or SHA256 digests differ")
          PY
            then
              draft_verified=true
              break
            fi
            sleep 5
          done
          test "$draft_verified" = true

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          verified=false
          for _ in {1..12}; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > final-release.json
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
            if python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("final-release.json").read_text(encoding="utf-8"))
          latest = json.loads(Path("latest-release.json").read_text(encoding="utf-8"))
          if release.get("tag_name") != os.environ["TAG"]:
              raise SystemExit("published release tag differs")
          if release.get("draft") is not False or release.get("prerelease") is not False:
              raise SystemExit("published release state differs")
          author = release.get("author", {})
          if (author.get("id"), author.get("login"), author.get("type")) != (41898282, "github-actions[bot]", "Bot"):
              raise SystemExit("published release author differs")
          if release.get("immutable") is not True:
              raise SystemExit("published release is not immutable")
          if release.get("name") != f"Blackcoin Core v{os.environ['VERSION']}":
              raise SystemExit("published release title differs")
          if release.get("body") != Path("RELEASE_NOTES.md").read_text(encoding="utf-8"):
              raise SystemExit("published release notes differ")
          if latest.get("id") != release.get("id"):
              raise SystemExit("v30.1.4 is not the latest release")
          expected = {}
          for path in Path("dist").iterdir():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              expected[path.name] = (path.stat().st_size, f"sha256:{digest}")
          assets = {
              asset["name"]: (asset["size"], asset.get("digest"))
              for asset in release.get("assets", [])
          }
          if assets != expected:
              raise SystemExit("published release asset names, sizes, or SHA256 digests differ")
          print(release["html_url"])
          PY
            then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = true

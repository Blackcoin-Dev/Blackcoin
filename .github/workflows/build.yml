          recovery_one_control_ref = f"refs/tags/{recovery_one_control_tag}"
          if recovery_one_control_tag_ref.get("ref") != recovery_one_control_ref:
              raise SystemExit("recovery-1 control tag ref differs")
          if (recovery_one_control_tag_ref.get("object", {}).get("type"), recovery_one_control_tag_ref.get("object", {}).get("sha")) != ("tag", recovery_one_control_tag_object):
              raise SystemExit("recovery-1 control tag ref object differs")
          if recovery_one_control_tag_doc.get("sha") != recovery_one_control_tag_object or recovery_one_control_tag_doc.get("tag") != recovery_one_control_tag:
              raise SystemExit("recovery-1 annotated tag identity differs")
          if (recovery_one_control_tag_doc.get("object", {}).get("type"), recovery_one_control_tag_doc.get("object", {}).get("sha")) != ("commit", recovery_one_control_sha):
              raise SystemExit("recovery-1 annotated tag target differs")
          if recovery_one_control_tag_doc.get("verification", {}).get("verified") is not True or recovery_one_control_tag_doc.get("verification", {}).get("reason") != "valid":
              raise SystemExit("GitHub does not verify the recovery-1 control tag")
          tagger = recovery_one_control_tag_doc.get("tagger", {})
          if (tagger.get("name"), tagger.get("email")) != expected_control_identity:
              raise SystemExit("recovery-1 control tagger identity differs")

          evidence = {
              "schema": 1,
              "release": "v30.1.4",
              "runtime_source": {"commit": source, "tag": "v30.1.4"},
              "publication_control": {
                  "event": "workflow_dispatch",

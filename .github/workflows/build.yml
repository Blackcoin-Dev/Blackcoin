name: v30.1.4 publication-only recovery

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Exact one-shot recovery acknowledgement
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v30.1.4-publication-only-recovery
  cancel-in-progress: false

jobs:
  publish:
    name: Resume and publish the verified v30.1.4 draft
    runs-on: ubuntu-22.04
    environment: production-release
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
      SOURCE_SHA: 13262151077cce3f72d07d17dc7725b2b6a8e1ab
      SOURCE_TAG: v30.1.4
      SOURCE_TAG_OBJECT: efe2b2d55355474fc7803f57d94df3579b8b84cb
      SOURCE_DATE_EPOCH: 1785901181
      PUBLISHED_RUN_ID: '31018993835'
      PUBLISHED_CONTROL_SHA: 47766daa49ea64782ad778f0d5222d8c2e2b0ffa
      PUBLISHED_CONTROL_REF: refs/tags/v30.1.4-publication-recovery-2
      PUBLISHED_CONTROL_TAG_OBJECT: ab8ad6b0403ca17b7913b7212fd952ee917d5553
      CONTROL_TAG: v30.1.4-publication-recovery-3
      CONTROL_PARENT: 47766daa49ea64782ad778f0d5222d8c2e2b0ffa
      DRAFT_RELEASE_ID: '365649567'
      EXPECTED_RELEASE_BODY_SHA256: 0e19d9b2b895ad30327f9ce9701ecc5dca5c9f8a24aa76113331b709b51f08c6
      UNSIGNED_FINAL_ACK: ${{ vars.UNSIGNED_FINAL_ACK }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout the immutable runtime source and all signed tags
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: 13262151077cce3f72d07d17dc7725b2b6a8e1ab
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          path: runtime-source

      - name: Checkout the pinned corrected identity verifier
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: 6e1fe69700e3c6495ddbd5d3746d6d91d8b26538
          fetch-depth: 1
          persist-credentials: false
          path: release-tools
          sparse-checkout: |
            ci/release/blackcoin-dev-release-signing.allowed_signers
            ci/release/verify_source_identity.py
          sparse-checkout-cone-mode: false

      - name: Verify the signed one-shot control and immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$ACKNOWLEDGEMENT" = 'PUBLISH-EXISTING-VERIFIED-V30.1.4-DRAFT-365649567'
          test "$UNSIGNED_FINAL_ACK" = 'V30.1.4'
          test "$GITHUB_REPOSITORY" = 'Blackcoin-Dev/Blackcoin'
          test "$GITHUB_ACTOR" = 'Blackcoin-Dev'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = "refs/tags/$CONTROL_TAG"
          test "$GITHUB_REF_NAME" = "$CONTROL_TAG"
          test "$GITHUB_REF_TYPE" = 'tag'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          git -C runtime-source fetch --force --tags origin
          test "$(git -C runtime-source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C runtime-source rev-parse "refs/tags/$SOURCE_TAG^{tag}")" = "$SOURCE_TAG_OBJECT"
          test "$(git -C runtime-source rev-parse "refs/tags/$SOURCE_TAG^{commit}")" = "$SOURCE_SHA"
          test "$(git -C runtime-source rev-parse "refs/tags/$CONTROL_TAG^{commit}")" = "$GITHUB_SHA"
          mapfile -t parents < <(git -C runtime-source rev-parse "$GITHUB_SHA^@")
          test "${#parents[@]}" = 1
          test "${parents[0]}" = "$CONTROL_PARENT"
          mapfile -t changed < <(git -C runtime-source diff --name-only "$CONTROL_PARENT" "$GITHUB_SHA")
          test "${#changed[@]}" = 1
          test "${changed[0]}" = '.github/workflows/build.yml'

          printf '%s  %s\n' \
            '68aaef3472ce552d1f261652e9b751f81073740f842574cf832fa8cd6ad6f462' \
            release-tools/ci/release/verify_source_identity.py \
            '4625f57db75b831cd947cee314b5b2ff5c3f79fdbfa29d64fbb8882d599e8451' \
            release-tools/ci/release/blackcoin-dev-release-signing.allowed_signers \
            | sha256sum --check --strict

          (
            cd runtime-source
            python3 ../release-tools/ci/release/verify_source_identity.py \
              --head "$SOURCE_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --require-actor --actor "$GITHUB_ACTOR" \
              --tag "$SOURCE_TAG" --require-signatures \
              --signing-fingerprint 'SHA256:jAkpBudDw+ntWHSUx3e1KY+czAFjnlaPxQtRFtptL70'
          )

          (
            cd runtime-source
            CONTROL_TAG="$CONTROL_TAG" CONTROL_SHA="$GITHUB_SHA" python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          path = Path("../release-tools/ci/release/verify_source_identity.py")
          spec = importlib.util.spec_from_file_location("release_identity", path)
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          verifier.verify_tag(
              os.environ["CONTROL_TAG"],
              os.environ["CONTROL_SHA"],
              verifier.EXPECTED_SSH_FINGERPRINT,
          )
          verifier.verify_ssh_signature(
              os.environ["CONTROL_SHA"],
              "commit",
              verifier.EXPECTED_SSH_FINGERPRINT,
          )
          verifier.verify_tag(
              "v30.1.4-publication-recovery-2",
              os.environ["PUBLISHED_CONTROL_SHA"],
              verifier.EXPECTED_SSH_FINGERPRINT,
          )
          verifier.verify_ssh_signature(
              os.environ["PUBLISHED_CONTROL_SHA"],
              "commit",
              verifier.EXPECTED_SSH_FINGERPRINT,
          )
          PY
          )

          CONTROL_TAG_OBJECT=$(git -C runtime-source rev-parse "refs/tags/$CONTROL_TAG^{tag}")
          [[ "$CONTROL_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" > control-commit.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CONTROL_TAG" > control-ref.json
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$CONTROL_TAG_OBJECT" > control-tag.json
          gh api "repos/$GITHUB_REPOSITORY/compare/$CONTROL_PARENT...$GITHUB_SHA" > control-compare.json
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" > source-commit.json
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$SOURCE_TAG_OBJECT" > source-tag.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" > source-ref.json
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$PUBLISHED_CONTROL_SHA" > published-control-commit.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${PUBLISHED_CONTROL_REF#refs/tags/}" > published-control-ref.json
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$PUBLISHED_CONTROL_TAG_OBJECT" > published-control-tag.json
          CONTROL_TAG_OBJECT="$CONTROL_TAG_OBJECT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          control = json.loads(Path("control-commit.json").read_text())
          ref = json.loads(Path("control-ref.json").read_text())
          tag = json.loads(Path("control-tag.json").read_text())
          compare = json.loads(Path("control-compare.json").read_text())
          source = json.loads(Path("source-commit.json").read_text())
          source_tag = json.loads(Path("source-tag.json").read_text())
          source_ref = json.loads(Path("source-ref.json").read_text())
          published_control = json.loads(Path("published-control-commit.json").read_text())
          published_control_ref = json.loads(Path("published-control-ref.json").read_text())
          published_control_tag = json.loads(Path("published-control-tag.json").read_text())
          control_sha = os.environ["GITHUB_SHA"]
          control_tag = os.environ["CONTROL_TAG"]
          control_tag_object = os.environ["CONTROL_TAG_OBJECT"]
          parent = os.environ["CONTROL_PARENT"]
          source_sha = os.environ["SOURCE_SHA"]
          source_tag_object = os.environ["SOURCE_TAG_OBJECT"]

          for label, commit, expected in (
              ("control", control, control_sha),
              ("source", source, source_sha),
              ("published control", published_control, os.environ["PUBLISHED_CONTROL_SHA"]),
          ):
              if commit.get("sha") != expected:
                  raise SystemExit(f"{label} commit identity differs")
              verification = commit.get("verification", {})
              if verification.get("verified") is not True or verification.get("reason") != "valid":
                  raise SystemExit(f"GitHub does not verify the {label} commit signature")
          identity = ("Blackcoin-Dev", "298119138+Blackcoin-Dev@users.noreply.github.com")
          if (control["author"]["name"], control["author"]["email"]) != identity:
              raise SystemExit("control author identity differs")
          if (control["committer"]["name"], control["committer"]["email"]) != identity:
              raise SystemExit("control committer identity differs")
          if ref.get("ref") != f"refs/tags/{control_tag}":
              raise SystemExit("control tag ref name differs")
          if (ref.get("object", {}).get("type"), ref.get("object", {}).get("sha")) != ("tag", control_tag_object):
              raise SystemExit("control tag ref object differs")
          if tag.get("sha") != control_tag_object or tag.get("tag") != control_tag:
              raise SystemExit("control annotated tag identity differs")
          if (tag.get("object", {}).get("type"), tag.get("object", {}).get("sha")) != ("commit", control_sha):
              raise SystemExit("control annotated tag target differs")
          verification = tag.get("verification", {})
          if verification.get("verified") is not True or verification.get("reason") != "valid":
              raise SystemExit("GitHub does not verify the control tag signature")
          if compare.get("status") != "ahead" or compare.get("ahead_by") != 1 or compare.get("behind_by") != 0:
              raise SystemExit("control must be the one-shot child of recovery-2")
          if compare.get("base_commit", {}).get("sha") != parent or compare.get("merge_base_commit", {}).get("sha") != parent:
              raise SystemExit("control comparison base differs")
          commits = compare.get("commits", [])
          if len(commits) != 1 or commits[0].get("sha") != control_sha:
              raise SystemExit("control comparison commit inventory differs")
          if source_ref.get("ref") != f"refs/tags/{os.environ['SOURCE_TAG']}":
              raise SystemExit("source tag ref differs")
          if (source_ref.get("object", {}).get("type"), source_ref.get("object", {}).get("sha")) != ("tag", source_tag_object):
              raise SystemExit("source tag ref object differs")
          if source_tag.get("sha") != source_tag_object:
              raise SystemExit("source annotated tag object differs")
          if (source_tag.get("object", {}).get("type"), source_tag.get("object", {}).get("sha")) != ("commit", source_sha):
              raise SystemExit("source annotated tag target differs")
          verification = source_tag.get("verification", {})
          if verification.get("verified") is not True or verification.get("reason") != "valid":
              raise SystemExit("GitHub does not verify the source tag signature")
          if published_control_ref.get("ref") != os.environ["PUBLISHED_CONTROL_REF"]:
              raise SystemExit("published control tag ref differs")
          if (published_control_ref.get("object", {}).get("type"), published_control_ref.get("object", {}).get("sha")) != ("tag", os.environ["PUBLISHED_CONTROL_TAG_OBJECT"]):
              raise SystemExit("published control tag ref object differs")
          if published_control_tag.get("sha") != os.environ["PUBLISHED_CONTROL_TAG_OBJECT"]:
              raise SystemExit("published control annotated tag object differs")
          if (published_control_tag.get("object", {}).get("type"), published_control_tag.get("object", {}).get("sha")) != ("commit", os.environ["PUBLISHED_CONTROL_SHA"]):
              raise SystemExit("published control annotated tag target differs")
          verification = published_control_tag.get("verification", {})
          if verification.get("verified") is not True or verification.get("reason") != "valid":
              raise SystemExit("GitHub does not verify the published control tag signature")
          PY

      - name: Bind the exact completed build, artifacts, attestations, and draft
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHED_RUN_ID" > prior-run.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHED_RUN_ID/jobs?per_page=100" \
            > prior-job-pages.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHED_RUN_ID/artifacts?per_page=100" \
            > prior-artifact-pages.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" \
            > bound-draft.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-pages.json

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def pages(path, key=None):
              data = json.loads(Path(path).read_text())
              values = []
              for page in data:
                  if key is None:
                      values.extend(page)
                  else:
                      values.extend(page.get(key, []))
              return values

          run = json.loads(Path("prior-run.json").read_text())
          expected_run = {
              "id": int(os.environ["PUBLISHED_RUN_ID"]),
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "failure",
              "head_sha": os.environ["PUBLISHED_CONTROL_SHA"],
              "head_branch": "v30.1.4-publication-recovery-2",
              "path": ".github/workflows/build.yml",
              "run_attempt": 1,
          }
          for key, value in expected_run.items():
              if run.get(key) != value:
                  raise SystemExit(f"prior run {key} differs")
          for key in ("actor", "triggering_actor"):
              actor = run.get(key, {})
              if (actor.get("id"), actor.get("login"), actor.get("type")) != (298119138, "Blackcoin-Dev", "User"):
                  raise SystemExit(f"prior run {key} differs")

          expected_jobs = {
              92350505594: ("Resolve and authorize immutable release target", "success"),
              92350575843: ("Verify API-bound exact-SHA v30.1.4 safety evidence", "success"),
              92350576702: ("Exact-SHA prerelease or production safety gate", "skipped"),
              92350677806: ("Require fresh or API-bound exact-SHA safety evidence", "success"),
              92350710985: ("Require explicit v30.1.4 signed-source publication acknowledgement", "success"),
              92350750631: ("Select build target", "success"),
              92350787409: ("macos-arm-64-bit (verifier)", "success"),
              92350787440: ("linux-arm-64-bit (primary)", "success"),
              92350787514: ("linux-64-bit (verifier)", "success"),
              92350787550: ("linux-arm-64-bit (verifier)", "success"),
              92350787687: ("macos-64-bit (verifier)", "success"),
              92350787703: ("macos-64-bit (primary)", "success"),
              92350787734: ("windows-64-bit (primary)", "success"),
              92350787754: ("windows-64-bit (verifier)", "success"),
              92350787761: ("linux-64-bit (primary)", "success"),
              92350787794: ("macos-arm-64-bit (primary)", "success"),
              92364724027: ("Ad-hoc sign and validate macOS Apple-Silicon-ARM64 (verifier)", "success"),
              92364724112: ("Ad-hoc sign and validate macOS Intel-x86_64 (primary)", "success"),
              92364724188: ("Ad-hoc sign and validate macOS Apple-Silicon-ARM64 (primary)", "success"),
              92364724430: ("Ad-hoc sign and validate macOS Intel-x86_64 (verifier)", "success"),
              92364934304: ("Require native macOS validation when selected", "success"),
              92364964863: ("Verify independent byte-for-byte rebuilds", "success"),
              92365046379: ("Publish authorized GitHub release", "failure"),
          }
          jobs = pages("prior-job-pages.json", "jobs")
          actual_jobs = {job["id"]: (job["name"], job["conclusion"]) for job in jobs}
          if actual_jobs != expected_jobs:
              raise SystemExit("prior run job identity or conclusion inventory differs")
          publish_job = next(job for job in jobs if job["id"] == 92365046379)
          steps = {step["number"]: (step["name"], step["conclusion"]) for step in publish_job.get("steps", [])}
          for number in range(1, 11):
              if steps.get(number, (None, None))[1] != "success":
                  raise SystemExit(f"prior publication prerequisite step {number} did not succeed")
          if steps.get(11) != ("Create, byte-verify, and publish the immutable release", "failure"):
              raise SystemExit("prior publication failure step differs")

          expected_artifacts = {
              8937482765: ("release-30.1.4-reproducibility-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:eb2f0f053e6f23dcc809d069748826c4aeb8027ac9cf1f9900277d5caf9e4850", 329),
              8937469933: ("release-30.1.4-macos-64-bit-primary-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:928d57e2059332714dd11908721541780e3e29631cbcd6c2e784819eab37e1fd", 38936719),
              8937463820: ("release-30.1.4-macos-64-bit-verifier-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:6a1f2258fb315ff3b8da486ad1849c5a383c4ae0f2d345e4f04f42aeac645566", 38936719),
              8937458796: ("release-30.1.4-macos-arm-64-bit-primary-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:3e917c2b0ff867cb925dbd98b98c4651c72bbb6bafd615b71d63474177bf8597", 36774323),
              8937457508: ("release-30.1.4-macos-arm-64-bit-verifier-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:8b63d0494cc712635c8f3ba6b36d95fd4345e6abdb5d829cab262834abab49cc", 36774323),
              8937443953: ("raw-release-30.1.4-macos-64-bit-primary-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:1240053ec1d34e893d4fe02fe6d7ec74efef98d619d9babc0aebdc82500c9d66", 38337264),
              8937431343: ("raw-release-30.1.4-macos-arm-64-bit-primary-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:8a354ca3f750241469cc72f5799f6573714e2a43547948667c65630bc25f68f9", 36843329),
              8936951773: ("raw-release-30.1.4-macos-64-bit-verifier-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:8c0777e724e258bd96fce00eb22a7234efa781d57bfdd013d49ab084ddb543fd", 38337264),
              8936950520: ("release-30.1.4-linux-arm-64-bit-verifier-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:7f4f4092952af1bb1eb0eb0f12380530ad4f43d57b7664f3336cb59bd1a6a74c", 46228781),
              8936931163: ("release-30.1.4-linux-arm-64-bit-primary-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:5977fe483b28862162ef253c513327f88f7bbb76a67229c31810051d4806245f", 46228781),
              8936886145: ("raw-release-30.1.4-macos-arm-64-bit-verifier-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:cc6ecc11cc97dac9a7705ed53acd70ef60010df0ac03af036c933383fd9e3c14", 36843329),
              8936830899: ("windows-installer-recipe-30.1.4-verifier-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:3c49e9236c74cb6b248ffc6fdd609f3fd7a8e3a69f29b13d3d4402466f774ccf", 2255),
              8936827437: ("release-30.1.4-windows-64-bit-verifier-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:88955c6e82d72c133fd238af2b7aac883e76ddafe97622ae5e2bd8ecf1765b9d", 72150677),
              8936825029: ("release-30.1.4-linux-64-bit-verifier-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:7b18026e18c87db741fb2a2b1bfba186a1c5eb0635f375306b3f0f2c383b1dcb", 47679067),
              8936785639: ("windows-installer-recipe-30.1.4-primary-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:77dc88d4aa58634243e4f4decee750c72d0751a61d48622f7fd1db8e44ce88d8", 2255),
              8936785168: ("release-30.1.4-windows-64-bit-primary-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:8cbd2d1674ff43fd012defdb63c39851b4a08e3d9defaf8e336237a4b5de0a4a", 72150677),
              8936759752: ("release-30.1.4-linux-64-bit-primary-13262151077cce3f72d07d17dc7725b2b6a8e1ab", "sha256:d2c41a701d293d131a9ebed93b510ad8dc0d0ecc9c33324fbb617960f205de3a", 47679067),
              8935763041: ("release-recovery-evidence-13262151077cce3f72d07d17dc7725b2b6a8e1ab-47766daa49ea64782ad778f0d5222d8c2e2b0ffa", "sha256:9c69a59757439c965d00bc360298534ed6ddcb8a1f65db4ebed416c3dbb3ed39", 3127),
          }
          artifacts = pages("prior-artifact-pages.json", "artifacts")
          actual_artifacts = {
              artifact["id"]: (artifact["name"], artifact.get("digest"), artifact["size_in_bytes"])
              for artifact in artifacts
          }
          if actual_artifacts != expected_artifacts:
              raise SystemExit("prior run artifact identity, digest, or size inventory differs")
          if any(artifact.get("expired") is not False for artifact in artifacts):
              raise SystemExit("a required prior-run artifact has expired")

          releases = pages("release-pages.json")
          matching_ids = [release.get("id") for release in releases if release.get("tag_name") == os.environ["SOURCE_TAG"]]
          if matching_ids != [int(os.environ["DRAFT_RELEASE_ID"])]:
              raise SystemExit("v30.1.4 release inventory is not unique")
          release = json.loads(Path("bound-draft.json").read_text())
          if release.get("id") != int(os.environ["DRAFT_RELEASE_ID"]):
              raise SystemExit("v30.1.4 numeric release identity differs")
          if release.get("name") != "Blackcoin Core v30.1.4" or release.get("prerelease") is not False:
              raise SystemExit("v30.1.4 title or prerelease state differs")
          author = release.get("author", {})
          if (author.get("id"), author.get("login"), author.get("type")) != (41898282, "github-actions[bot]", "Bot"):
              raise SystemExit("v30.1.4 release author differs")
          body = (release.get("body") or "").encode()
          if hashlib.sha256(body).hexdigest() != os.environ["EXPECTED_RELEASE_BODY_SHA256"]:
              raise SystemExit("v30.1.4 release notes differ from the verified recovery-2 body")
          if release.get("draft") is not True or release.get("immutable") is not False:
              raise SystemExit("v30.1.4 is no longer the expected resumable draft")
          expected_names = {
              "Blackcoin-30.1.4-Linux-ARM64.tar.gz",
              "Blackcoin-30.1.4-Linux-x86_64.tar.gz",
              "Blackcoin-30.1.4-RELEASE-RECOVERY-EVIDENCE.json",
              "Blackcoin-30.1.4-REPRODUCIBILITY.txt",
              "Blackcoin-30.1.4-SBOM.spdx.json",
              "Blackcoin-30.1.4-UNSIGNED-PRODUCTION.json",
              "Blackcoin-30.1.4-UNSIGNED-PRODUCTION.txt",
              "Blackcoin-30.1.4-Windows-x86_64-Installer.exe",

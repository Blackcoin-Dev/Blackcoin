name: v30.1.4 signed maintenance release build

on:
  workflow_dispatch:
    inputs:
      publication_recovery:
        description: Recover the immutable v30.1.4 signed-tag publication (exact pins only)
        required: true
        default: false
        type: boolean
      target_sha:
        description: Full 40-character commit SHA (must be the frozen v30.1.4 SHA for recovery)
        required: true
        type: string
      package_label:
        description: Prerelease label, or exactly 30.1.4 for publication recovery
        required: true
        default: 30.1.4-alpha1
        type: string
      target:
        description: Build target (recovery requires all; other manual runs never publish)
        required: true
        type: choice
        default: all
        options:
          - all
          - linux-64-bit
          - linux-arm-64-bit
          - windows-64-bit
          - macos-all
          - macos-64-bit
          - macos-arm-64-bit
  push:
    tags:
      - 'v30.1.4'

permissions:
  contents: read

concurrency:
  group: v30.1.4-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve and authorize immutable release target
    runs-on: ubuntu-22.04
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      source_date_epoch: ${{ steps.resolve.outputs.source_date_epoch }}
      version: ${{ steps.resolve.outputs.version }}
      package_label: ${{ steps.resolve.outputs.package_label }}
      configured_version: ${{ steps.resolve.outputs.configured_version }}
      release_candidate: ${{ steps.resolve.outputs.release_candidate }}
      prerelease_channel: ${{ steps.resolve.outputs.prerelease_channel }}
      asset_prefix: ${{ steps.resolve.outputs.asset_prefix }}
      target: ${{ steps.resolve.outputs.target }}
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}
      recovery: ${{ steps.resolve.outputs.recovery }}
      control_workflow_sha: ${{ steps.resolve.outputs.control_workflow_sha }}
      control_workflow_ref: ${{ steps.resolve.outputs.control_workflow_ref }}
      control_workflow_event: ${{ steps.resolve.outputs.control_workflow_event }}
      control_tag_object_sha: ${{ steps.resolve.outputs.control_tag_object_sha }}
    steps:
      - name: Checkout requested target
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_recovery && '13262151077cce3f72d07d17dc7725b2b6a8e1ab' || (github.event_name == 'workflow_dispatch' && inputs.target_sha || github.ref) }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout the pinned corrected identity verifier from main
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_recovery }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: 6e1fe69700e3c6495ddbd5d3746d6d91d8b26538
          fetch-depth: 1
          persist-credentials: false
          path: .release-recovery-tools
          sparse-checkout: |
            ci/release/blackcoin-dev-release-signing.allowed_signers
            ci/release/verify_source_identity.py
          sparse-checkout-cone-mode: false

      - id: resolve
        name: Verify identity, tag, version, and exact SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
          REQUESTED_PACKAGE_LABEL: ${{ inputs.package_label }}
          REQUESTED_TARGET: ${{ inputs.target }}
          REQUESTED_RECOVERY: ${{ inputs.publication_recovery }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FROZEN_SOURCE_SHA=13262151077cce3f72d07d17dc7725b2b6a8e1ab
          FROZEN_TAG_OBJECT_SHA=efe2b2d55355474fc7803f57d94df3579b8b84cb
          CONTROL_TAG=v30.1.4-publication-recovery-2
          CONTROL_BASE_SHA=19baffef25af36e177db2975780e0641b59753aa
          IDENTITY_TOOLS_SHA=6e1fe69700e3c6495ddbd5d3746d6d91d8b26538
          IDENTITY_VERIFIER_SHA256=68aaef3472ce552d1f261652e9b751f81073740f842574cf832fa8cd6ad6f462
          ALLOWED_SIGNERS_SHA256=4625f57db75b831cd947cee314b5b2ff5c3f79fdbfa29d64fbb8882d599e8451
          RECOVERY=false
          CONTROL_TAG_OBJECT_SHA=
          TARGET_SHA=$(git rev-parse HEAD)
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          MAJOR=$(sed -n "s/^define(_CLIENT_VERSION_MAJOR, \([0-9]*\))$/\1/p" configure.ac)
          MINOR=$(sed -n "s/^define(_CLIENT_VERSION_MINOR, \([0-9]*\))$/\1/p" configure.ac)
          BUILD=$(sed -n "s/^define(_CLIENT_VERSION_BUILD, \([0-9]*\))$/\1/p" configure.ac)
          RC=$(sed -n "s/^define(_CLIENT_VERSION_RC, \([0-9]*\))$/\1/p" configure.ac)
          IS_RELEASE=$(sed -n "s/^define(_CLIENT_VERSION_IS_RELEASE, \(.*\))$/\1/p" configure.ac)
          BASE_VERSION="$MAJOR.$MINOR.$BUILD"
          test "$BASE_VERSION" = "30.1.4" || {
            echo "::error::This workflow is locked to the v30.1.4 source line"
            exit 1
          }
          [[ "$RC" =~ ^[0-9]+$ ]]
          CONFIGURED_VERSION="$BASE_VERSION"
          if [[ "$RC" != "0" ]]; then
            CONFIGURED_VERSION="${BASE_VERSION}rc${RC}"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_RECOVERY" == "true" ]]; then
            RECOVERY=true
            test "$GITHUB_REPOSITORY" = Blackcoin-Dev/Blackcoin
            test "$GITHUB_ACTOR" = Blackcoin-Dev
            test "$GITHUB_REF" = "refs/tags/$CONTROL_TAG"
            test "$GITHUB_REF_NAME" = "$CONTROL_TAG"
            test "$GITHUB_REF_TYPE" = tag
            [[ "$CALLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$CALLER_WORKFLOW_SHA" = "$EVENT_SHA" || {
              echo "::error::The recovery workflow and selected control-tag revision differ"
              exit 1
            }
            test "$REQUESTED_SHA" = "$FROZEN_SOURCE_SHA"
            test "$TARGET_SHA" = "$FROZEN_SOURCE_SHA"
            test "$REQUESTED_PACKAGE_LABEL" = 30.1.4
            test "$REQUESTED_TARGET" = all
            test "$BASE_VERSION" = 30.1.4
            test "$RC" = 0
            test "$IS_RELEASE" = true
            test "$(git rev-parse "refs/tags/v30.1.4^{tag}")" = "$FROZEN_TAG_OBJECT_SHA"
            test "$(git rev-parse "refs/tags/v30.1.4^{commit}")" = "$FROZEN_SOURCE_SHA"
            CONTROL_TAG_OBJECT_SHA=$(git rev-parse "refs/tags/$CONTROL_TAG^{tag}")
            [[ "$CONTROL_TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse "refs/tags/$CONTROL_TAG^{commit}")" = "$CALLER_WORKFLOW_SHA"
            mapfile -t control_parents < <(git rev-parse "$CALLER_WORKFLOW_SHA^@")
            test "${#control_parents[@]}" = 1
            test "${control_parents[0]}" = "$CONTROL_BASE_SHA"
            git merge-base --is-ancestor "$CONTROL_BASE_SHA" "$CALLER_WORKFLOW_SHA"
            test "$(git rev-list --count "$CONTROL_BASE_SHA..$CALLER_WORKFLOW_SHA")" = 1
            mapfile -t control_paths < <(git diff --name-only "$CONTROL_BASE_SHA" "$CALLER_WORKFLOW_SHA")
            test "${#control_paths[@]}" = 1
            test "${control_paths[0]}" = .github/workflows/build.yml

            test "$(git -C .release-recovery-tools rev-parse HEAD)" = "$IDENTITY_TOOLS_SHA"
            printf '%s  %s\n' \
              "$IDENTITY_VERIFIER_SHA256" \
              .release-recovery-tools/ci/release/verify_source_identity.py \
              "$ALLOWED_SIGNERS_SHA256" \
              .release-recovery-tools/ci/release/blackcoin-dev-release-signing.allowed_signers \
              | sha256sum --check --strict

            CONTROL_TAG="$CONTROL_TAG" CALLER_WORKFLOW_SHA="$CALLER_WORKFLOW_SHA" python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          verifier_path = Path(".release-recovery-tools/ci/release/verify_source_identity.py")
          spec = importlib.util.spec_from_file_location("recovery_identity", verifier_path)
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          verifier.verify_tag(
              os.environ["CONTROL_TAG"],
              os.environ["CALLER_WORKFLOW_SHA"],
              verifier.EXPECTED_SSH_FINGERPRINT,
          )
          verifier.verify_ssh_signature(
              os.environ["CALLER_WORKFLOW_SHA"],
              "commit",
              verifier.EXPECTED_SSH_FINGERPRINT,
          )
          PY

            gh api "repos/$GITHUB_REPOSITORY/git/commits/$CALLER_WORKFLOW_SHA" > control-commit.json
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CONTROL_TAG" > control-tag-ref.json
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$CONTROL_TAG_OBJECT_SHA" > control-tag.json
            gh api "repos/$GITHUB_REPOSITORY/compare/$CONTROL_BASE_SHA...$CALLER_WORKFLOW_SHA" > control-base.json
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$IDENTITY_TOOLS_SHA" > tools-commit.json
            gh api "repos/$GITHUB_REPOSITORY/compare/$IDENTITY_TOOLS_SHA...$CONTROL_BASE_SHA" > tools-base.json
            CALLER_WORKFLOW_SHA="$CALLER_WORKFLOW_SHA" \
              CONTROL_TAG="$CONTROL_TAG" \
              CONTROL_TAG_OBJECT_SHA="$CONTROL_TAG_OBJECT_SHA" \
              CONTROL_BASE_SHA="$CONTROL_BASE_SHA" \
              IDENTITY_TOOLS_SHA="$IDENTITY_TOOLS_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          control = json.loads(Path("control-commit.json").read_text(encoding="utf-8"))
          control_tag_ref = json.loads(Path("control-tag-ref.json").read_text(encoding="utf-8"))
          control_tag = json.loads(Path("control-tag.json").read_text(encoding="utf-8"))
          control_base = json.loads(Path("control-base.json").read_text(encoding="utf-8"))
          tools = json.loads(Path("tools-commit.json").read_text(encoding="utf-8"))
          tools_base = json.loads(Path("tools-base.json").read_text(encoding="utf-8"))
          workflow_sha = os.environ["CALLER_WORKFLOW_SHA"]
          control_tag_name = os.environ["CONTROL_TAG"]
          control_tag_object = os.environ["CONTROL_TAG_OBJECT_SHA"]
          control_base_sha = os.environ["CONTROL_BASE_SHA"]
          tools_sha = os.environ["IDENTITY_TOOLS_SHA"]

          for label, commit, expected in (
              ("control workflow", control, workflow_sha),
              ("identity tools", tools, tools_sha),
          ):
              if commit.get("sha") != expected:
                  raise SystemExit(f"GitHub {label} commit differs")
              if commit.get("verification", {}).get("verified") is not True:
                  raise SystemExit(f"GitHub does not verify the {label} commit")
              if commit.get("verification", {}).get("reason") != "valid":
                  raise SystemExit(f"GitHub {label} signature reason is not valid")
          expected_identity = ("Blackcoin-Dev", "298119138+Blackcoin-Dev@users.noreply.github.com")
          if (control.get("author", {}).get("name"), control.get("author", {}).get("email")) != expected_identity:
              raise SystemExit("control workflow author identity differs")
          if (control.get("committer", {}).get("name"), control.get("committer", {}).get("email")) != expected_identity:
              raise SystemExit("control workflow committer identity differs")
          if control_tag_ref.get("ref") != f"refs/tags/{control_tag_name}":
              raise SystemExit("control tag ref name differs")
          if (control_tag_ref.get("object", {}).get("type"), control_tag_ref.get("object", {}).get("sha")) != ("tag", control_tag_object):
              raise SystemExit("control tag ref object differs")
          if control_tag.get("sha") != control_tag_object or control_tag.get("tag") != control_tag_name:
              raise SystemExit("control annotated tag identity differs")
          if (control_tag.get("object", {}).get("type"), control_tag.get("object", {}).get("sha")) != ("commit", workflow_sha):
              raise SystemExit("control annotated tag target differs")
          if control_tag.get("verification", {}).get("verified") is not True:
              raise SystemExit("GitHub does not verify the control tag signature")
          if control_tag.get("verification", {}).get("reason") != "valid":
              raise SystemExit("GitHub control tag signature reason is not valid")
          if control_base.get("status") != "ahead" or control_base.get("ahead_by") != 1 or control_base.get("behind_by") != 0:
              raise SystemExit("control workflow must be the one-shot descendant of the audited main head")
          if control_base.get("base_commit", {}).get("sha") != control_base_sha:
              raise SystemExit("control workflow audited base differs")
          if control_base.get("merge_base_commit", {}).get("sha") != control_base_sha:
              raise SystemExit("audited main head is not the control workflow parent")
          commits = control_base.get("commits", [])
          if len(commits) != 1 or commits[0].get("sha") != workflow_sha:
              raise SystemExit("control workflow comparison commit inventory differs")
          if tools_base.get("status") not in ("ahead", "identical"):
              raise SystemExit("the corrected identity verifier is not on the audited main history")
          if tools_base.get("base_commit", {}).get("sha") != tools_sha:
              raise SystemExit("the corrected identity verifier base differs")
          if tools_base.get("merge_base_commit", {}).get("sha") != tools_sha:
              raise SystemExit("the corrected identity verifier is not an ancestor of the audited main head")
          PY

            TAG=v30.1.4
            VERSION=30.1.4
            PACKAGE_LABEL=30.1.4
            PRERELEASE_CHANNEL=production
            ASSET_PREFIX=Blackcoin-30.1.4
            TARGET=all
            PUBLISH=true
            python3 .release-recovery-tools/ci/release/verify_source_identity.py \
              --head "$TARGET_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --require-actor \
              --actor "$GITHUB_ACTOR" \
              --tag "$TAG" \
              --require-signatures \
              --signing-fingerprint 'SHA256:jAkpBudDw+ntWHSUx3e1KY+czAFjnlaPxQtRFtptL70'
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$REQUESTED_RECOVERY" = false
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::target_sha must be a full 40-character commit SHA"
              exit 1
            }
            test "$TARGET_SHA" = "$REQUESTED_SHA"
            [[ "$CALLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$CALLER_WORKFLOW_SHA" = "$TARGET_SHA" || {
              echo "::error::Run this workflow from a branch or tag whose head is target_sha; the local safety gate otherwise comes from a different revision"
              exit 1
            }
            test "$EVENT_SHA" = "$TARGET_SHA" || {
              echo "::error::The selected workflow_dispatch ref does not resolve to target_sha"
              exit 1
            }
            [[ "$REQUESTED_PACKAGE_LABEL" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)([1-9][0-9]*)$ ]] || {
              echo "::error::Manual builds require an explicit major.minor.patch-alphaN or major.minor.patch-betaN package label"
              exit 1
            }
            PRERELEASE_CHANNEL="${BASH_REMATCH[1]}"
            PRERELEASE_NUMBER="${BASH_REMATCH[2]}"
            [[ "$RC" =~ ^[1-9][0-9]*$ ]]
            test "$IS_RELEASE" = "false" || {
              echo "::error::Manual prerelease builds require CLIENT_VERSION_IS_RELEASE=false"
              exit 1
            }
            test "$PRERELEASE_NUMBER" = "$RC"
            test "$REQUESTED_PACKAGE_LABEL" = "$BASE_VERSION-$PRERELEASE_CHANNEL$RC" || {
              echo "::error::Package label must match the source version and RC: $BASE_VERSION-$PRERELEASE_CHANNEL$RC"
              exit 1
            }
            VERSION="$BASE_VERSION"
            PACKAGE_LABEL="$REQUESTED_PACKAGE_LABEL"
            ASSET_PREFIX="Blackcoin-$PACKAGE_LABEL-$TARGET_SHA"
            TARGET="$REQUESTED_TARGET"
            TAG=""
            PUBLISH=false
            python3 ci/release/verify_source_identity.py \
              --head "$TARGET_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --require-actor \
              --actor "$GITHUB_ACTOR"
          else
            [[ -z "$REQUESTED_RECOVERY" || "$REQUESTED_RECOVERY" == false ]]
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/tags/v30.1.4
            test "$GITHUB_REF_NAME" = v30.1.4
            test "$GITHUB_REF_TYPE" = tag
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            PACKAGE_LABEL="$VERSION"
            PRERELEASE_CHANNEL=production
            ASSET_PREFIX="Blackcoin-$VERSION"
            TARGET=all
            PUBLISH=true
            python3 ci/release/verify_source_identity.py \
              --head "$TARGET_SHA" \
              --repository "$GITHUB_REPOSITORY" \
              --require-actor \
              --actor "$GITHUB_ACTOR" \
              --tag "$TAG" \
              --require-signatures \
              --signing-fingerprint 'SHA256:jAkpBudDw+ntWHSUx3e1KY+czAFjnlaPxQtRFtptL70'
          fi

          if [[ "$PUBLISH" == true ]]; then
            TAG_OBJECT_SHA=$(git rev-parse "refs/tags/$TAG^{tag}")
            [[ "$TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$RECOVERY" == true ]]; then
              test "$TAG_OBJECT_SHA" = "$FROZEN_TAG_OBJECT_SHA"
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/commits/$TARGET_SHA" > commit-verification.json
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" > tag-verification.json
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag-ref.json
            TARGET_SHA="$TARGET_SHA" TAG="$TAG" TAG_OBJECT_SHA="$TAG_OBJECT_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          commit = json.loads(Path("commit-verification.json").read_text(encoding="utf-8"))
          tag = json.loads(Path("tag-verification.json").read_text(encoding="utf-8"))
          tag_ref = json.loads(Path("tag-ref.json").read_text(encoding="utf-8"))
          target = os.environ["TARGET_SHA"]
          tag_name = os.environ["TAG"]
          tag_object = os.environ["TAG_OBJECT_SHA"]
          if tag_ref.get("ref") != f"refs/tags/{tag_name}":
              raise SystemExit("GitHub tag ref name differs")
          if (tag_ref.get("object", {}).get("type"), tag_ref.get("object", {}).get("sha")) != ("tag", tag_object):
              raise SystemExit("GitHub tag ref does not resolve to the exact annotated tag object")
          if commit.get("sha") != target:
              raise SystemExit("GitHub commit verification resolved a different source")
          if commit.get("verification", {}).get("verified") is not True:
              raise SystemExit("GitHub does not verify the exact source commit signature")
          if commit.get("verification", {}).get("reason") != "valid":
              raise SystemExit("GitHub source commit signature reason is not valid")
          expected_tag = {
              "sha": tag_object,
              "tag": tag_name,
          }
          for key, expected in expected_tag.items():
              if tag.get(key) != expected:
                  raise SystemExit(f"GitHub tag {key} mismatch")
          if (tag.get("object", {}).get("type"), tag.get("object", {}).get("sha")) != ("commit", target):
              raise SystemExit("GitHub annotated tag does not point to the exact source commit")
          if tag.get("verification", {}).get("verified") is not True:
              raise SystemExit("GitHub does not verify the exact annotated tag signature")
          if tag.get("verification", {}).get("reason") != "valid":
              raise SystemExit("GitHub annotated tag signature reason is not valid")
          PY

            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > existing-release.json
              RECOVERY="$RECOVERY" TARGET_SHA="$TARGET_SHA" TAG="$TAG" \
                CONTROL_WORKFLOW_REF="$GITHUB_REF" \
                CONTROL_WORKFLOW_SHA="$CALLER_WORKFLOW_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          release = json.loads(Path("existing-release.json").read_text(encoding="utf-8"))
          if release.get("draft") is not True:
              raise SystemExit("an existing public release is immutable")
          author = release.get("author", {})
          if (author.get("id"), author.get("login"), author.get("type")) != (41898282, "github-actions[bot]", "Bot"):
              raise SystemExit("existing draft author differs from the pinned GitHub Actions bot")
          if os.environ["RECOVERY"] != "true":
              raise SystemExit("only the exact publication recovery may resume a draft")
          if release.get("tag_name") != os.environ["TAG"]:
              raise SystemExit("existing draft tag differs")
          if release.get("prerelease") is not False or release.get("name") != "Blackcoin Core v30.1.4":
              raise SystemExit("existing draft title or prerelease state differs")
          body = release.get("body") or ""
          required = (
              os.environ["TARGET_SHA"],
              os.environ["CONTROL_WORKFLOW_REF"],
              os.environ["CONTROL_WORKFLOW_SHA"],
          )
          if any(value not in body for value in required):
              raise SystemExit("existing draft is not bound to the exact source and recovery control")
          run_markers = re.findall(r"Recovery workflow run: `([1-9][0-9]*)`[.]", body)
          if len(run_markers) != 1:
              raise SystemExit("existing draft does not bind one prior recovery run")
          PY
            fi
          fi

          test "$VERSION" = "$BASE_VERSION"
          if [[ "$PUBLISH" == true ]]; then
            test "$RC" = "0"
            test "$IS_RELEASE" = "true" || {
              echo "::error::configure.ac still marks this commit as a development build"
              exit 1
            }
            NOTES="doc/release-notes/release-notes-$VERSION.md"
            test -s "$NOTES" || {
              echo "::error::Final tracked release notes are required at $NOTES"
              exit 1
            }
            ! grep -q 'RELEASE_NOTES_NOT_FINAL' "$NOTES" || {
              echo "::error::Release notes are still marked non-final"
              exit 1
            }
          fi

          {
            echo "target_sha=$TARGET_SHA"
            echo "source_date_epoch=$(git show -s --format=%ct "$TARGET_SHA")"
            echo "version=$VERSION"
            echo "package_label=$PACKAGE_LABEL"
            echo "configured_version=$CONFIGURED_VERSION"
            echo "release_candidate=$RC"
            echo "prerelease_channel=$PRERELEASE_CHANNEL"
            echo "asset_prefix=$ASSET_PREFIX"
            echo "target=$TARGET"
            echo "publish=$PUBLISH"
            echo "tag=$TAG"
            echo "recovery=$RECOVERY"
            echo "control_workflow_sha=$CALLER_WORKFLOW_SHA"
            echo "control_workflow_ref=$GITHUB_REF"
            echo "control_workflow_event=$GITHUB_EVENT_NAME"
            echo "control_tag_object_sha=$CONTROL_TAG_OBJECT_SHA"
          } >> "$GITHUB_OUTPUT"

  safety-gate:
    name: Exact-SHA prerelease or production safety gate
    needs:
      - resolve-target
    if: ${{ needs.resolve-target.outputs.recovery != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/pr-gate.yml
    with:
      target_sha: ${{ needs.resolve-target.outputs.target_sha }}
      # Alpha artifacts wait for the core gate. A beta adds native-platform,
      # sanitizer, pinned-fuzz, and complete extended functional evidence.
      # Normal production runs execute every exact-SHA gate. The one-time
      # recovery separately verifies the already-complete 16-job exact-SHA run
      # through immutable GitHub API identities before it may skip this work.
      release_mode: ${{ needs.resolve-target.outputs.publish == 'true' || needs.resolve-target.outputs.prerelease_channel == 'beta' }}
      run_extended_functional: ${{ needs.resolve-target.outputs.publish == 'true' || needs.resolve-target.outputs.prerelease_channel == 'beta' }}
      corrective_fast_path: false

  recovery-safety-gate:
    name: Verify API-bound exact-SHA v30.1.4 safety evidence
    needs:
      - resolve-target
    if: ${{ needs.resolve-target.outputs.recovery == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 13262151077cce3f72d07d17dc7725b2b6a8e1ab
      SAFETY_RUN_ID: '30973290346'
      SAFETY_RUN_ATTEMPT: '1'
      FAILED_RELEASE_RUN_ID: '30982555787'
      FAILED_RELEASE_RUN_ATTEMPT: '1'
      RECOVERY_ONE_RUN_ID: '31017178339'
      RECOVERY_ONE_RUN_ATTEMPT: '1'
      RECOVERY_ONE_CONTROL_SHA: 1e4f5db01b819a192566e6184c700234e46294ce

                          "name": name,
                          "conclusion": conclusion,
                      }
                      for job_id, (name, conclusion) in sorted(expected_recovery_one_jobs.items())
                  ],
                  "artifacts": [
                      {
                          "id": artifact_id,
                          "name": expected_recovery_one_artifact[artifact_id][0],
                          "size_in_bytes": expected_recovery_one_artifact[artifact_id][1],

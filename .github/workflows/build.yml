          if recovery_one_control_commit.get("sha") != recovery_one_control_sha:
              raise SystemExit("GitHub recovery-1 control commit differs")
          if recovery_one_control_commit.get("verification", {}).get("verified") is not True or recovery_one_control_commit.get("verification", {}).get("reason") != "valid":
              raise SystemExit("GitHub does not verify the recovery-1 control commit")
          for field in ("author", "committer"):
              identity = recovery_one_control_commit.get(field, {})
              if (identity.get("name"), identity.get("email")) != expected_control_identity:

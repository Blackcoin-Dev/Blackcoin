              raise SystemExit("recovery-1 artifact identity differs")
          for artifact_id, expected in expected_recovery_one_artifact.items():
              artifact = recovery_one_artifacts_by_id[artifact_id]
              if (artifact.get("name"), artifact.get("size_in_bytes"), artifact.get("digest")) != expected:
                  raise SystemExit("recovery-1 evidence artifact metadata differs")
              if artifact.get("expired") is not False:
                  raise SystemExit("recovery-1 evidence artifact is expired")
              workflow_run = artifact.get("workflow_run", {})
              if (workflow_run.get("id"), workflow_run.get("head_sha")) != (recovery_one_run_id, recovery_one_control_sha):
                  raise SystemExit("recovery-1 artifact workflow identity differs")
          artifact_names = [artifact.get("name", "") for artifact in recovery_one_artifacts]
          if any(
              name.startswith(("release-30.1.4-", "raw-release-30.1.4-", "windows-installer-recipe-30.1.4-"))
              or "reproducibility" in name
              for name in artifact_names
          ):
